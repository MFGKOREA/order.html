<style>
  /* Layout: one portrait canvas (720×1280) letterboxed in the viewport. Field on top, controls below. */
  :root {
    --night: #1f130c;
    --night-2: #3b2519;
    --ink: #f4efff;
    --coin: #ffc93c;
    --font-ui: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-display: "Black Han Sans", "Jua", "Apple SD Gothic Neo", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night));
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    box-sizing: border-box;
    height: 100%;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    place-items: center;
  }
  canvas {
    display: block;
    touch-action: none;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgb(0 0 0 / 0.45);
  }
  canvas:focus-visible { outline: 3px solid var(--coin); outline-offset: 3px; }
</style>

function gradeOdds(luck) {
  const p = GRADE_P.slice();
  const sh = Math.min(luck, 15) * 0.02;
  p[0] -= sh; p[1] += sh * 0.6; p[2] += sh * 0.3; p[3] += sh * 0.1;
  return p;
}

];

  const raw = JSON.parse(localStorage.getItem('nyang-meta') || 'null');
  if (raw && typeof raw.gold === 'number') meta = { gold: raw.gold, lv: raw.lv || {} };
} catch (e) { /* storage unavailable */ }
const metaLv = id => meta.lv[id] || 0;
function saveMeta() { try { localStorage.setItem('nyang-meta', JSON.stringify(meta)); } catch (e) { /* storage unavailable */ } }
function buyMeta(i) {
  const m = META[i], lv = metaLv(m.id);
  if (lv >= m.max || meta.gold < metaCost(m, lv)) return false;
  meta.gold -= metaCost(m, lv);
  meta.lv[m.id] = lv + 1;
  saveMeta();
  return true;
}

  S.mods.armor = metaLv('armor') * 0.04;
  S.coins += metaLv('coin') * 15;
  S.mods.luck = metaLv('luck');
  S.mods.xp += metaLv('xp') * 0.08;
  startRound(1);
}

function openShop() {
  S.shopReturn = S.phase;
  S.phase = 'shop';
}

// ── Level-up cards
function rollCards() {
  const pool = CARDS.filter(c => !c.max || (S.picks[c.id] || 0) < c.max);
  const cards = [];
  while (cards.length < 3 && pool.length) cards.push(pool.splice(randInt(pool.length), 1)[0]);
  // Recommend drilling the type the squad leans on most, otherwise raw damage
  const weight = TYPES.map(() => 0);
  for (const u of S.slots) if (u) weight[u.type] += Math.pow(2.5, u.grade);
  const top = weight.indexOf(Math.max(...weight));
  let rec = cards.findIndex(c => c.ti === top && weight[top] > 0);
  if (rec < 0) rec = cards.findIndex(c => c.id === 'atk');
  return { cards, rec, t: 0 };
}
function openPick() {
  S.pick = rollCards();
  S.drag = null;
  sfx('level');
}
function choosePick(i) {
  const c = S.pick && S.pick.cards[i];
  if (!c) return;
  c.apply();
  S.picks[c.id] = (S.picks[c.id] || 0) + 1;
  S.pick = null;
  sfx('merge');
  if (S.pendingLv > 0 && !S.reveal) { S.pendingLv--; openPick(); }
}
function reroll() {
  if (!S.pick || S.rerolls <= 0) return;
  S.rerolls--;
  S.pick = rollCards();
  sfx('click');
}
function gainXp(v) {
  S.xp += v * S.mods.xp;
  while (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level);
    S.level++;
    if (S.pick || S.reveal) S.pendingLv++;
    else openPick();
  }
}

// ── Legendary reveal
function openReveal(ti) {
  S.reveal = { ti, t: 0 };
  S.drag = null;
  sfx('legend');
}
function closeReveal() {
  S.reveal = null;
  if (S.pendingLv > 0 && !S.pick) { S.pendingLv--; openPick(); }
}

function startRound(r) {
  S.round = r;
  S.t = ROUND_TIME;
  S.qClock = 0;
  S.queue = [];
  const n = r === LAST_ROUND ? 24 : Math.round(8 + r * 1.5);
  for (let i = 0; i < n; i++) {
    let type = 'grunt';
    const x = Math.random();
    if (r >= 3 && x < 0.25) type = 'runner';
    else if (r >= 6 && x < 0.25 + Math.min(0.25, r * 0.01)) type = 'tank';
    S.queue.push({ at: 0.8 + i * (19 / n) + rand(-0.3, 0.3), type });
  }
  if (r % 10 === 0 && r < LAST_ROUND) S.queue.push({ at: 5, type: 'mini' });
  if (r === LAST_ROUND) S.queue.push({ at: 0.5, type: 'boss' });
  S.queue.sort((a, b) => a.at - b.at);

  if (r === LAST_ROUND) { showBanner(L('finalIncoming'), L('finalBossSub'), '#ff4d5e', 'boss', 'boss'); sfx('boss'); }
  else if (r % 10 === 0) { showBanner(L('miniIncoming'), `ROUND ${r}`, '#ff7b00', 'boss', 'mini'); sfx('boss'); }
  else { showBanner(`ROUND ${r}`, null, '#6c7ee1'); sfx('round'); }
}

function spawn(type) {
  const d = MON[type];
  const r = S.round;
  const hp = type === 'boss' ? BOSS_HP : hpBase(r) * d.hp;
  const m = {
    type, d, x: W + d.r + rand(0, 30),
    y: d.boss ? rand(FIELD_T + 260, FIELD_B - 260) : rand(FIELD_T + 36, FIELD_B - 36),
    hp, maxHp: hp, r: d.r,
    spd: d.spd * (1 + r * 0.006),
    atk: d.atk * (1 + r * 0.04),
    atkT: 0.4, slowT: 0, slow: 0, flash: 0, bite: 0,
    anim: rand(0, 10), dead: false,
    coin: d.coin * (1 + Math.floor(r / 5)),
  };
  S.mons.push(m);
  if (d.boss) S.boss = m;
}

function makeUnit(type, grade) { return { type, grade, cd: rand(0, 0.3), kick: 0, pop: 1 }; }

function rollGrade() {
  const p = gradeOdds(S.mods.luck);
  let x = Math.random();
  for (let g = 0; g < p.length; g++) { x -= p[g]; if (x < 0) return g; }
  return 0;
}

function doDraw() {
  if (S.phase !== 'play' || S.paused || S.pick || S.reveal) return;
  const cost = drawCost();
  const empty = S.slots.findIndex(s => !s);
  if (empty < 0) return toast(L('noSlot'));
  if (S.coins < cost) return toast(L('noCoins', cost));
  S.coins -= cost;
  S.draws++;
  const u = makeUnit(randInt(TYPES.length), rollGrade());
  S.slots[empty] = u;
  burst(SLOTS[empty].x, SLOTS[empty].y, GRADES[u.grade].color, 14);
  if (u.grade === 3) openReveal(u.type);
  else if (u.grade === 2) { toast(L('epicDraw', unitName(u.type))); sfx('merge'); }
  else sfx('draw');
}

function freeSummon() {
  const empty = S.slots.findIndex(s => !s);
  if (empty < 0) { S.coins += drawCost(); return; }
  const u = makeUnit(randInt(TYPES.length), rollGrade());
  S.slots[empty] = u;
  burst(SLOTS[empty].x, SLOTS[empty].y, GRADES[u.grade].color, 14);
  if (u.grade === 3) openReveal(u.type);
}

const canMerge = (a, b) => a && b && a !== b && a.type === b.type && a.grade === b.grade && a.grade < GRADES.length - 1;

function merge(from, to) {
  const a = S.slots[from], b = S.slots[to];
  if (!canMerge(a, b)) return false;
  S.slots[from] = null;
  b.grade++;
  b.pop = 1;
  b.cd = 0;
  burst(SLOTS[to].x, SLOTS[to].y, GRADES[b.grade].color, 26);
  ring(SLOTS[to].x, SLOTS[to].y, GRADES[b.grade].color);
  if (b.grade === 3) openReveal(b.type);
  else sfx('merge');
  return true;
}

function sell(i) {
  const u = S.slots[i];
  if (!u) return;
  const v = GRADES[u.grade].sell;
  S.coins += v;
  S.slots[i] = null;
  floatText(SLOTS[i].x, SLOTS[i].y - 30, `+${v}`, '#ffc93c', 30);
  sfx('sell');
}

function endGame(win, reason) {
  if (S.phase !== 'play') return;
  S.phase = 'over';
  S.result = win ? 'win' : 'lose';
  S.reason = reason;
  S.drag = null;
  S.pick = null;
  S.reveal = null;
  S.goldEarned = Math.floor(S.kills / 5) + S.round * 6 + (win ? 250 : 0);
  meta.gold += S.goldEarned;
  saveMeta();
  const rec = win ? LAST_ROUND + 1 : S.round;
  if (rec > best) { best = rec; try { localStorage.setItem('nyang-best', String(best)); } catch (e) { /* storage unavailable */ } }
  sfx(win ? 'win' : 'lose');
}

// ───────────────────────── Combat ─────────────────────────
function findTarget(slot, T) {
  let best = null, bv = Infinity;
  for (const m of S.mons) {
    if (m.dead || m.x > W - 4 || m.x - slot.x > T.range) continue;
    const v = T.kind === 'snipe' ? -m.hp : m.x;
    if (v < bv) { bv = v; best = m; }
  }
  return best;
}

function hit(m, dmg) {
  if (m.dead) return;
  m.hp -= dmg;
  m.flash = 0.07;
  if (m.hp <= 0) kill(m);
}

function dmgText(x, y, v, crit) {
  if (S.texts.length > 60) return;
  const n = v >= 10000 ? (v / 1000).toFixed(0) + 'k' : v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
  S.texts.push({ x: x + rand(-10, 10), y, str: crit ? n + '!' : n, color: crit ? '#ffd166' : '#ffffff', size: crit ? 30 : 21, life: 0.7, max: 0.7 });
}

function kill(m) {
  m.dead = true;
  S.kills++;
  const coin = Math.round(m.coin * S.mods.coin);
  S.coins += coin;
  if (coin) floatText(m.x, m.y - m.r - 6, `+${coin}`, '#ffc93c', m.d.boss ? 34 : 22);
  if (XP_OF[m.type]) {
    S.gems.push({ x: m.x, y: m.y, vx: rand(-90, 90), vy: rand(-220, -90), t: 0, xp: XP_OF[m.type], big: m.d.boss });
  }
  if (S.mods.heal && Math.random() < S.mods.heal && S.wall < S.wallMax) {
    S.wall = Math.min(S.wallMax, S.wall + 5);
    floatText(WALL_X + 30, m.y, '+5', '#7ee081', 26);
  }
  burst(m.x, m.y, m.d.color, m.d.boss ? 50 : 10);
  if (S.boss === m) S.boss = null;
  if (m.type === 'boss') endGame(true, 'bossDown');
}

function fire(u, slot, tgt) {
  const T = TYPES[u.type];
  const crit = Math.random() < S.mods.crit;
  const dmg = T.dmg * GRADES[u.grade].mul * S.mods.atk * S.mods.type[u.type] * (crit ? 2 : 1);
  const sx = slot.x + 26, sy = slot.y + 4;
  switch (T.kind) {
    case 'bullet':
      S.projs.push({ k: 'bullet', x: sx, y: sy, tgt, spd: 1100, dmg, crit, color: '#ffe08a', g: u.grade });
      break;
    case 'ice':
      S.projs.push({ k: 'ice', x: sx, y: sy, tgt, spd: 700, dmg, crit, color: '#bff4ff', slow: Math.min(0.8, T.slow + S.mods.slow), slowT: T.slowT, g: u.grade });
      break;
    case 'snipe':
      dmgText(tgt.x, tgt.y - tgt.r - 14, dmg, crit);
      hit(tgt, dmg);
      S.fx.push({ k: 'line', pts: [sx, sy, tgt.x, tgt.y], color: '#a9c6ff', w: 3 + u.grade, life: 0.14, max: 0.14 });
      break;
    case 'zap': {
      const pts = [sx, sy];
      const done = new Set();
      let cur = tgt, d = dmg;
      for (let i = 0; i < T.chain + u.grade + S.mods.chain && cur; i++) {
        hit(cur, d);
        done.add(cur);
        pts.push(cur.x, cur.y);
        d *= 0.8;
        let nx = null, nd = 150;
        for (const m of S.mons) {
          if (m.dead || done.has(m)) continue;
          const dd = Math.hypot(m.x - cur.x, m.y - cur.y);
          if (dd < nd) { nd = dd; nx = m; }
        }
        cur = nx;
      }
      S.fx.push({ k: 'zap', pts, color: '#d9b8ff', life: 0.16, max: 0.16 });
      break;
    }
    case 'flame': {
      const rr = (T.aoe + u.grade * 10) * S.mods.aoe;
      for (const m of S.mons) if (!m.dead && Math.hypot(m.x - tgt.x, m.y - tgt.y) < rr + m.r) hit(m, dmg);
      for (let i = 0; i < 2; i++) {
        S.fx.push({ k: 'flame', x: sx, y: sy, tx: tgt.x + rand(-rr, rr) * 0.5, ty: tgt.y + rand(-rr, rr) * 0.5,
          life: 0.32, max: 0.32, s: 8 + u.grade * 3 });
      }
      break;
    }
    case 'shell': {
      const sf = tgt.slowT > 0 ? 1 - tgt.slow : 1;
      const stopX = WALL_X + 10 + tgt.r;
      const tx = Math.max(stopX, tgt.x - tgt.spd * sf * 0.6);
      S.projs.push({ k: 'shell', sx, sy: sy - 10, tx, ty: tgt.y, t: 0, dur: 0.6, dmg, crit, aoe: (T.aoe + u.grade * 12) * S.mods.aoe, g: u.grade });
      break;
    }
  }
}

function update(dt) {
  S.time += dt;
  ageFx(dt);
  if (S.phase !== 'play' || S.paused) return;
  if (S.reveal) { S.reveal.t += dt; if (S.reveal.t > 2.8) closeReveal(); return; }
  if (S.pick) { S.pick.t += dt; return; }

  // Round clock
  S.t -= dt;
  S.qClock += dt;
  while (S.queue.length && S.queue[0].at <= S.qClock) spawn(S.queue.shift().type);
  if (S.t <= 0) {
    if (S.round >= LAST_ROUND) { endGame(false, 'timeUp'); return; }
    const bonus = 15 + S.round * 2;
    S.coins += bonus;
    floatText(W / 2, 960, L('roundBonus', bonus), '#ffc93c', 30);
    startRound(S.round + 1);
  }

  // Monsters
  S.wallShake = Math.max(0, S.wallShake - dt);
  S.wallHitSfx -= dt;
  for (const m of S.mons) {
    if (m.dead) continue;
    m.slowT -= dt;
    m.flash -= dt;
    m.bite = Math.max(0, m.bite - dt);
    const sf = m.slowT > 0 ? 1 - m.slow : 1;
    m.anim += dt * sf;
    const stopX = WALL_X + 10 + m.r;
    if (m.x > stopX) {
      m.x = Math.max(stopX, m.x - m.spd * sf * dt);
    } else {
      m.atkT -= dt * sf;
      if (m.atkT <= 0) {
        m.atkT = 1;
        m.bite = 0.2;
        S.wall -= m.atk * (1 - S.mods.armor);
        S.wallShake = 0.25;
        if (S.wallHitSfx <= 0) { sfx('wall'); S.wallHitSfx = 0.25; }
        if (S.wall <= 0) { S.wall = 0; endGame(false, 'wallDown'); return; }
      }
    }
  }

  // Units
  for (let i = 0; i < S.slots.length; i++) {
    const u = S.slots[i];
    if (!u) continue;
    u.kick = Math.max(0, u.kick - dt * 6);
    u.pop = Math.max(0, u.pop - dt * 3);
    if (S.drag && S.drag.from === i && S.drag.moved) continue;
    u.cd -= dt;
    if (u.cd > 0) continue;
    const T = TYPES[u.type];
    const tgt = findTarget(SLOTS[i], T);
    if (!tgt) { u.cd = 0.05; continue; }
    fire(u, SLOTS[i], tgt);
    if (S.phase !== 'play') return;
    u.cd = T.cd * GRADES[u.grade].cdm / S.mods.spd;
    u.kick = 1;
  }

  // Projectiles
  for (const p of S.projs) {
    if (p.k === 'shell') {
      p.t += dt;
      if (p.t >= p.dur) {
        p.done = true;
        dmgText(p.tx, p.ty - 30, p.dmg, p.crit);
        for (const m of S.mons) if (!m.dead && Math.hypot(m.x - p.tx, m.y - p.ty) < p.aoe + m.r) hit(m, p.dmg);
        S.fx.push({ k: 'boom', x: p.tx, y: p.ty, r: p.aoe, life: 0.35, max: 0.35 });
        if (S.phase !== 'play') return;
      }
      continue;
    }
    const m = p.tgt;
    if (m.dead) { p.done = true; continue; }
    const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy);
    const step = p.spd * dt;
    if (d <= step + m.r * 0.5) {
      p.done = true;
      if (p.crit) dmgText(m.x, m.y - m.r - 14, p.dmg, true);
      hit(m, p.dmg);
      if (p.k === 'ice' && !m.dead) { m.slow = Math.max(m.slowT > 0 ? m.slow : 0, p.slow); m.slowT = p.slowT; }
      S.fx.push({ k: 'spark', x: m.x - m.r * 0.6, y: m.y + rand(-6, 6), color: p.color, life: 0.15, max: 0.15 });
      if (S.phase !== 'play') return;
    } else {
      p.x += dx / d * step;
      p.y += dy / d * step;
    }
  }
  S.projs = S.projs.filter(p => !p.done);
  S.mons = S.mons.filter(m => !m.dead);

  // XP gems pop out, then fly into the XP bar
  const tx = XPBAR.x + XPBAR.w * clamp(S.xp / xpNeed(S.level), 0, 1), ty = XPBAR.y + XPBAR.h / 2;
  for (const g of S.gems) {
    g.t += dt;
    if (g.t < 0.35) { g.x += g.vx * dt; g.y += g.vy * dt; g.vy += 600 * dt; continue; }
    const dx = tx - g.x, dy = ty - g.y, d = Math.hypot(dx, dy), sp = 300 + (g.t - 0.35) * 2400;
    if (d < sp * dt + 10) { g.done = true; gainXp(g.xp); }
    else { g.x += dx / d * sp * dt; g.y += dy / d * sp * dt; }
  }
  S.gems = S.gems.filter(g => !g.done);
}

// ───────────────────────── Effects ─────────────────────────
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(60, 260);
    S.fx.push({ k: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: rand(0.3, 0.6), max: 0.6, s: rand(3, 7) });
  }
}
function ring(x, y, color) { S.fx.push({ k: 'ring', x, y, color, life: 0.5, max: 0.5 }); }
function floatText(x, y, str, color, size) { S.texts.push({ x, y, str, color, size, life: 1.1, max: 1.1 }); }
function toast(str) { S.toast = { str, life: 1.8 }; }
function showBanner(title, sub, color, style = null, mon = null) {
  const life = style === 'boss' ? 2.4 : 1.8;
  S.banner = { title, sub, color, style, mon, life, max: life };
}

function ageFx(dt) {
  for (const f of S.fx) {
    f.life -= dt;
    if (f.k === 'dot') { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; }
  }
  if (S.fx.length > 500) S.fx.splice(0, S.fx.length - 500);
  S.fx = S.fx.filter(f => f.life > 0);
  for (const t of S.texts) { t.life -= dt; t.y -= 40 * dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  if (S.toast && (S.toast.life -= dt) <= 0) S.toast = null;
  if (S.banner && (S.banner.life -= dt) <= 0) S.banner = null;
}

// ───────────────────────── Sound ─────────────────────────
let AC = null, muted = false;
try { muted = localStorage.getItem('nyang-mute') === '1'; } catch (e) { muted = false; }
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
function tone(freq, freq2, dur, type = 'square', vol = 0.08, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}
function sfx(name) {
  switch (name) {
    case 'draw':   tone(520, 880, 0.1); break;
    case 'merge':  tone(440, 1200, 0.18, 'triangle', 0.1); break;
    case 'legend': [523, 659, 784, 1046].forEach((f, i) => tone(f, f * 1.01, 0.22, 'triangle', 0.1, i * 0.09)); break;
    case 'sell':   tone(900, 600, 0.1, 'triangle'); break;
    case 'wall':   tone(140, 70, 0.14, 'sawtooth', 0.06); break;
    case 'round':  tone(392, 392, 0.1, 'square', 0.06); tone(587, 587, 0.14, 'square', 0.06, 0.1); break;
    case 'boss':   tone(110, 55, 0.6, 'sawtooth', 0.1); tone(116, 58, 0.6, 'sawtooth', 0.08, 0.05); break;
    case 'win':    [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f, 0.25, 'triangle', 0.1, i * 0.12)); break;
    case 'lose':   [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.3, 'triangle', 0.1, i * 0.16)); break;
    case 'click':  tone(700, 700, 0.04, 'square', 0.04); break;
    case 'level':  [440, 554, 659, 880].forEach((f, i) => tone(f, f * 1.02, 0.14, 'triangle', 0.09, i * 0.06)); break;
  }
}

// ───────────────────────── Rendering ─────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale = 1;

function resize() {
  const stage = document.getElementById('stage');
  const cs = getComputedStyle(stage);
  const bw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const bh = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.max(0.1, Math.min(bw / W, bh / H));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  canvas.width = Math.floor(W * s * dpr);
  canvas.height = Math.floor(H * s * dpr);
  scale = canvas.width / W;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, align = 'center', font = FONT_UI, stroke = 0, maxW = 0) {
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = stroke;
    ctx.strokeStyle = INK;
    if (maxW) ctx.strokeText(str, x, y, maxW); else ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = color;
  if (maxW) ctx.fillText(str, x, y, maxW); else ctx.fillText(str, x, y);
}

// Cel shading: fill the shape in its shadow tone, then the base tone shifted up-left inside it,
// leaving a crescent of shadow on the lower right. Finish with a small white shine.
function shadeTone(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.round(clamp(c * k, 0, 255));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function celEllipse(x, y, rx, ry, color, lw = 4) {
  ctx.save();
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = shadeTone(color, 0.72); ctx.fill();
  ctx.clip();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(x - rx * 0.16, y - ry * 0.2, rx * 0.95, ry * 0.92, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
}
function shine(x, y, rx, ry) {
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, -0.5, 0, Math.PI * 2); ctx.fill();
}

// Cocoa-brown space backdrop with light swooshes, painted once into an offscreen canvas.
const BG = document.createElement('canvas');
function paintBackground() {
  const k = 2;
  BG.width = W * k; BG.height = H * k;
  const b = BG.getContext('2d');
  b.scale(k, k);
  // Enemy side: warm space with a soft glow
  const g = b.createRadialGradient(560, 460, 30, 520, 520, 560);
  g.addColorStop(0, '#9a6a45');
  g.addColorStop(0.45, '#6e4630');
  g.addColorStop(1, '#43281b');
  b.fillStyle = g;
  b.fillRect(WALL_X, FIELD_T, W - WALL_X, FIELD_B - FIELD_T);
  b.save();
  b.beginPath(); b.rect(WALL_X, FIELD_T, W - WALL_X, FIELD_B - FIELD_T); b.clip();
  b.lineCap = 'round';
  const swoosh = (cx, cy, rx, ry, rot, a0, a1, wid) => {
    b.save();
    b.shadowColor = 'rgba(255,214,120,0.7)';
    b.shadowBlur = 24;
    for (const [col, w] of [['rgba(255,222,140,0.42)', wid], ['rgba(150,166,255,0.6)', wid * 0.5], ['rgba(255,252,236,0.95)', wid * 0.14]]) {
      b.strokeStyle = col; b.lineWidth = w;
      b.beginPath(); b.ellipse(cx, cy, rx, ry, rot, a0, a1); b.stroke();
    }
    b.restore();
  };
  swoosh(520, 520, 300, 120, -0.35, 3.4, 5.9, 26);
  swoosh(560, 300, 220, 80, 0.25, 0.2, 2.6, 18);
  swoosh(470, 760, 260, 90, -0.15, 3.6, 6.1, 20);
  // Confetti and soft orbs
  const conf = ['#ffc93c', '#c9b6ff', '#ffb08a', '#8fa0ef', '#fff3d6'];
  for (let i = 0; i < 70; i++) {
    b.fillStyle = conf[i % conf.length];
    b.globalAlpha = rand(0.35, 0.9);
    const x = rand(WALL_X + 20, W), y = rand(FIELD_T, FIELD_B);
    if (i % 3 === 0) { b.beginPath(); b.arc(x, y, rand(2, 4), 0, Math.PI * 2); b.fill(); }
    else { b.save(); b.translate(x, y); b.rotate(rand(0, 3)); b.fillRect(-4, -1.5, 8, 3); b.restore(); }
  }
  for (let i = 0; i < 6; i++) {
    b.globalAlpha = 0.18;
    b.fillStyle = conf[i % conf.length];
    b.beginPath(); b.arc(rand(WALL_X + 60, W - 30), rand(FIELD_T + 40, FIELD_B - 40), rand(10, 22), 0, Math.PI * 2); b.fill();
  }
  b.globalAlpha = 1;
  b.restore();
  // Our side: the cats' deck
  b.fillStyle = '#3b2519';
  b.fillRect(0, FIELD_T, WALL_X, FIELD_B - FIELD_T);
  b.strokeStyle = 'rgba(255,230,190,0.05)';
  b.lineWidth = 2;
  for (let y = FIELD_T; y < FIELD_B; y += 44) { b.beginPath(); b.moveTo(0, y); b.lineTo(WALL_X, y); b.stroke(); }
  for (let x = 22; x < WALL_X; x += 88) { b.beginPath(); b.moveTo(x, FIELD_T); b.lineTo(x, FIELD_B); b.stroke(); }
}

// A few twinkling four-point sparkles, drawn live
const SPARKLES = Array.from({ length: 12 }, () => ({
  x: rand(WALL_X + 30, W - 20), y: rand(FIELD_T + 20, FIELD_B - 20), s: rand(5, 11), p: rand(0, 6),
}));
function sparkle(x, y, s, color = '#fff6d6') {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s);
  ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s);
  ctx.fill();
}

function drawField() {
  ctx.drawImage(BG, 0, 0, W, H);
  for (const sp of SPARKLES) {
    const a = 0.5 + Math.sin(S.time * 2.4 + sp.p) * 0.5;
    ctx.globalAlpha = a;
    sparkle(sp.x, sp.y, sp.s * (0.6 + a * 0.4));
  }
  ctx.globalAlpha = 1;
}

function drawWall() {
  const sh = S.wallShake > 0 ? rand(-3, 3) : 0;
  const ratio = S.wall / S.wallMax;
  const x = WALL_X + sh;
  ctx.fillStyle = INK;
  ctx.fillRect(x - 2, FIELD_T, 20, FIELD_B - FIELD_T);
  const col = ratio > 0.5 ? '#e9d8b4' : ratio > 0.25 ? '#f0a848' : '#e5484d';
  for (let y = FIELD_T; y < FIELD_B; y += 40) {
    ctx.fillStyle = col;
    rr(x, y + 3, 16, 34, 5);
    ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = 'rgba(80,40,20,0.25)';
    ctx.fillRect(x + 10, y + 7, 4, 26);
    ctx.fillStyle = '#8fa0ef';
    ctx.fillRect(x + 1, y + 17, 14, 5);
  }
  if (ratio < 0.5) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    for (let i = 0; i < Math.floor((1 - ratio) * 10); i++) {
      const cy = FIELD_T + 40 + ((i * 197) % (FIELD_B - FIELD_T - 80));
      ctx.beginPath(); ctx.moveTo(x + 2, cy); ctx.lineTo(x + 8, cy + 8); ctx.lineTo(x + 4, cy + 16); ctx.stroke();
    }
  }
}

// Space-suited cat facing right. Fur is the breed, suit color tells the unit type.
function drawCat(x, y, size, ti, grade, t, kick, alpha = 1) {
  const T = TYPES[ti];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x - kick * 5, y + Math.sin(t * 3 + x * 0.1) * 1.5);
  const k = size / 80;
  ctx.scale(k, k);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = INK;

  // Back gear
  if (T.kind === 'flame') {
    ctx.lineWidth = 3.5;
    ctx.fillStyle = '#ff9f1c';
    rr(-31, -2, 14, 26, 6); ctx.fill(); ctx.stroke();
  }
  // Suit
  celEllipse(0, 21, 18, 14, T.color);
  ctx.fillStyle = '#ffc93c';
  ctx.beginPath(); ctx.arc(5, 20, 4, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2; ctx.stroke();
  // Ears
  ctx.lineWidth = 4;
  ctx.fillStyle = T.fur;
  ctx.beginPath();
  ctx.moveTo(-21, -12); ctx.quadraticCurveTo(-22, -32, -16, -38); ctx.quadraticCurveTo(-8, -30, -3, -24); ctx.closePath();
  ctx.moveTo(5, -24); ctx.quadraticCurveTo(12, -32, 18, -38); ctx.quadraticCurveTo(23, -30, 21, -12); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f4a7a0';
  ctx.beginPath();
  ctx.moveTo(-17, -20); ctx.lineTo(-15, -31); ctx.lineTo(-9, -24); ctx.closePath();
  ctx.moveTo(10, -24); ctx.lineTo(16, -31); ctx.lineTo(17, -20); ctx.closePath();
  ctx.fill();
  // Head
  celEllipse(0, -5, 23, 21, T.fur, 4.5);
  // Helmet cap in suit color, hugging the top of the head
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, -5, 23, 21, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = T.color;
  ctx.beginPath(); ctx.ellipse(-2, -26, 30, 15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 3.5; ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, -5, 23, 21, 0, 0, Math.PI * 2);
  ctx.lineWidth = 4.5; ctx.stroke();
  shine(-10, -18, 6, 3);
  // Tabby marks
  if (T.tabby) {
    ctx.strokeStyle = shadeTone(T.fur, 0.62); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-21, -3); ctx.lineTo(-14, -2); ctx.moveTo(-21, 4); ctx.lineTo(-14, 3); ctx.stroke();
    ctx.strokeStyle = INK;
  }
  // Face (looks right)
  ctx.fillStyle = '#fff6e6';
  ctx.beginPath(); ctx.ellipse(7, 4, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(1, -5, 2.6, 3.6, 0, 0, Math.PI * 2); ctx.ellipse(14, -5, 2.6, 3.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(1.8, -6.4, 1, 0, Math.PI * 2); ctx.arc(14.8, -6.4, 1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,130,130,0.55)';
  ctx.beginPath(); ctx.ellipse(-5, 3, 4, 2.4, 0, 0, Math.PI * 2); ctx.ellipse(19, 3, 3.5, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e07a6a';
  ctx.beginPath(); ctx.ellipse(8, 1.5, 2.4, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(5, 5); ctx.quadraticCurveTo(6.5, 7.5, 8, 5); ctx.quadraticCurveTo(9.5, 7.5, 11, 5); ctx.stroke();

  // Weapon
  ctx.lineWidth = 3.5;
  ctx.fillStyle = '#4b3a5a';
  switch (T.kind) {
    case 'bullet':
      rr(6, 13, 34, 9, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffc93c'; ctx.fillRect(34, 14, 5, 7);
      break;
    case 'snipe':
      rr(4, 14, 48, 7, 3); ctx.fill(); ctx.stroke();
      rr(16, 5, 15, 8, 3); ctx.fillStyle = '#8fa0ef'; ctx.fill(); ctx.stroke();
      break;
    case 'flame':
      rr(4, 12, 28, 11, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff6b35'; ctx.beginPath(); ctx.arc(35, 17, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      break;
    case 'shell':
      ctx.save(); ctx.translate(6, 19); ctx.rotate(-0.6);
      rr(0, -7, 32, 15, 5); ctx.fillStyle = '#6a5a7e'; ctx.fill(); ctx.stroke();
      ctx.restore();
      break;
    case 'ice':
      ctx.strokeStyle = '#7a5530'; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(26, 32); ctx.lineTo(30, -18); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.fillStyle = '#c9f3ff';
      ctx.beginPath(); ctx.moveTo(30, -38); ctx.lineTo(39, -25); ctx.lineTo(30, -12); ctx.lineTo(21, -25); ctx.closePath(); ctx.fill(); ctx.stroke();
      sparkle(36, -36, 5);
      break;
    case 'zap':
      rr(6, 12, 24, 11, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e0c3ff'; ctx.beginPath(); ctx.arc(35, 17, 7.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (Math.sin(t * 20) > 0.3) {
        ctx.strokeStyle = '#fff6d6'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(39, 9); ctx.lineTo(45, 3); ctx.lineTo(43, 11); ctx.lineTo(49, 7); ctx.stroke();
      }
      break;
  }
  // Grade ornament
  ctx.strokeStyle = INK; ctx.lineWidth = 3;
  if (grade >= 2) {
    ctx.fillStyle = grade === 3 ? '#ffc93c' : '#d9a7ff';
    ctx.beginPath();
    ctx.moveTo(-12, -30); ctx.lineTo(-12, -42); ctx.lineTo(-6, -36); ctx.lineTo(0, -46);
    ctx.lineTo(6, -36); ctx.lineTo(12, -42); ctx.lineTo(12, -30); ctx.closePath();
    ctx.fill(); ctx.stroke();
    if (grade === 3) sparkle(16, -46, 6);
  } else if (grade === 1) {
    ctx.fillStyle = '#8fa0ef';
    ctx.beginPath(); ctx.moveTo(0, -27); ctx.lineTo(0, -40); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -42, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawStars(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const cx = x + (i - (n - 1) / 2) * 13;
    ctx.beginPath();
    for (let j = 0; j < 10; j++) {
      const a = -Math.PI / 2 + j * Math.PI / 5, rad = j % 2 ? 2.6 : 6;
      ctx.lineTo(cx + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function drawSlots() {
  const dragU = S.drag && S.drag.moved ? S.slots[S.drag.from] : null;
  for (let i = 0; i < SLOTS.length; i++) {
    const s = SLOTS[i], u = S.slots[i];
    const x = s.x - CELL / 2, y = s.y - CELL / 2;
    const mergeable = dragU && canMerge(dragU, u);
    if (!u) {
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 2;
      rr(x + 4, y + 4, CELL - 8, CELL - 8, 14); ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }
    const G = GRADES[u.grade];
    const p = 1 + u.pop * 0.25;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(p, p);
    ctx.fillStyle = 'rgba(36,20,12,0.55)';
    rr(-CELL / 2 + 3, -CELL / 2 + 3, CELL - 6, CELL - 6, 16); ctx.fill();
    ctx.strokeStyle = G.color;
    ctx.lineWidth = u.grade === 3 ? 4 + Math.sin(S.time * 6) * 1.2 : 3;
    rr(-CELL / 2 + 3, -CELL / 2 + 3, CELL - 6, CELL - 6, 16); ctx.stroke();
    if (mergeable) {
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = 0.5 + Math.sin(S.time * 10) * 0.4;
      ctx.lineWidth = 5;
      rr(-CELL / 2 - 2, -CELL / 2 - 2, CELL + 4, CELL + 4, 18); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    const hidden = S.drag && S.drag.moved && S.drag.from === i;
    drawCat(s.x - 3, s.y + 2, 72 * p, u.type, u.grade, S.time, u.kick, hidden ? 0.25 : 1);
    drawStars(s.x, s.y + CELL / 2 - 4, u.grade + 1, G.color);
    if (S.sel === i) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      rr(x - 2, y - 2, CELL + 4, CELL + 4, 18); ctx.stroke();
    }
  }
}

function drawRange() {
  const i = S.drag && S.drag.moved ? S.drag.from : S.sel;
  if (i < 0 || i == null) return;
  const u = S.slots[i];
  if (!u) return;
  const T = TYPES[u.type];
  const sx = S.drag && S.drag.moved ? S.drag.x : SLOTS[i].x;
  const x1 = Math.min(W, sx + T.range);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(WALL_X + 16, FIELD_T, Math.max(0, x1 - WALL_X - 16), FIELD_B - FIELD_T);
  if (x1 < W) {
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x1, FIELD_T); ctx.lineTo(x1, FIELD_B); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawMon(m) {
  const d = m.d;
  const wob = Math.sin(m.anim * 10) * 0.08;
  const bx = m.x - m.bite * 20;
  ctx.save();
  ctx.translate(bx, m.y);
  // Shadow
  ctx.fillStyle = 'rgba(30,17,10,0.35)';
  ctx.beginPath(); ctx.ellipse(0, m.r * 0.85, m.r * 0.9, m.r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  // Legs
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(3, m.r * 0.15);
  ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    const ph = Math.sin(m.anim * 12 + i * 2) * m.r * 0.18;
    ctx.beginPath(); ctx.moveTo(i * m.r * 0.45, m.r * 0.4); ctx.lineTo(i * m.r * 0.6 + ph, m.r * 0.85); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  ctx.scale(1 + wob, 1 - wob);
  // Boss horns
  if (d.boss) {
    ctx.fillStyle = '#fff1d6';
    ctx.lineWidth = 3;
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sgn * m.r * 0.35, -m.r * 0.7);
      ctx.lineTo(sgn * m.r * 0.65, -m.r * 1.35);
      ctx.lineTo(sgn * m.r * 0.7, -m.r * 0.55);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  // Torso
  celEllipse(0, 0, m.r, m.r * 0.85, d.color, Math.max(3.5, m.r * 0.13));
  shine(-m.r * 0.15, -m.r * 0.55, m.r * 0.22, m.r * 0.1);
  if (m.type === 'tank' || d.boss) {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(m.r * 0.15, -m.r * 0.15, m.r * 0.75, m.r * 0.55, 0, Math.PI, Math.PI * 2); ctx.fill();
  }
  if (m.type === 'runner') {
    ctx.fillStyle = INK;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(m.r * 0.1 + i * 6, -m.r * 0.8); ctx.lineTo(m.r * 0.3 + i * 6, -m.r * 1.2); ctx.lineTo(m.r * 0.45 + i * 6, -m.r * 0.75); ctx.fill();
    }
  }
  // Eyes (look left)
  const er = Math.max(4, m.r * 0.24);
  ctx.fillStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-m.r * 0.38, -m.r * 0.2, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(m.r * 0.05, -m.r * 0.22, er * 0.85, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(-m.r * 0.45, -m.r * 0.18, er * 0.5, 0, Math.PI * 2); ctx.arc(-m.r * 0.02, -m.r * 0.2, er * 0.42, 0, Math.PI * 2); ctx.fill();
  if (d.boss) {
    ctx.fillStyle = '#2b0b14';
    ctx.beginPath(); ctx.ellipse(-m.r * 0.3, m.r * 0.32, m.r * 0.38, m.r * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 5; i++) {
      const tx = -m.r * 0.6 + i * m.r * 0.15;
      ctx.beginPath(); ctx.moveTo(tx, m.r * 0.2); ctx.lineTo(tx + m.r * 0.07, m.r * 0.32); ctx.lineTo(tx + m.r * 0.14, m.r * 0.2); ctx.fill();
    }
  }
  // Status overlays
  if (m.slowT > 0) {
    ctx.fillStyle = 'rgba(150,230,255,0.38)';
    ctx.beginPath(); ctx.ellipse(0, 0, m.r, m.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (m.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.ellipse(0, 0, m.r, m.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // HP bar
  if (m.hp < m.maxHp) {
    const bw = Math.max(30, m.r * 1.8), by = m.y - m.r - 12;
    ctx.fillStyle = 'rgba(30,17,10,0.7)';
    ctx.fillRect(bx - bw / 2 - 1, by - 1, bw + 2, 7);
    ctx.fillStyle = d.boss ? '#ff4d5e' : '#7ee081';
    ctx.fillRect(bx - bw / 2, by, bw * clamp(m.hp / m.maxHp, 0, 1), 5);
  }
}

function drawProjs() {
  for (const p of S.projs) {
    if (p.k === 'shell') {
      const k = p.t / p.dur;
      const x = p.sx + (p.tx - p.sx) * k;
      const y = p.sy + (p.ty - p.sy) * k - Math.sin(k * Math.PI) * 160;
      ctx.fillStyle = '#2f2a45';
      ctx.strokeStyle = '#ffc93c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 7 + p.g, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      continue;
    }
    ctx.fillStyle = p.color;
    if (p.k === 'ice') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.PI / 4);
      ctx.fillRect(-5 - p.g, -5 - p.g, 10 + p.g * 2, 10 + p.g * 2);
      ctx.restore();
    } else {
      ctx.fillRect(p.x - 8, p.y - 2 - p.g * 0.5, 16, 4 + p.g);
    }
  }
}

function drawFx() {
  for (const f of S.fx) {
    const a = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = a;
    switch (f.k) {
      case 'dot':
        ctx.fillStyle = f.color;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.s * a + 1, 0, Math.PI * 2); ctx.fill();
        break;
      case 'line':
        ctx.strokeStyle = f.color; ctx.lineWidth = f.w;
        ctx.beginPath(); ctx.moveTo(f.pts[0], f.pts[1]); ctx.lineTo(f.pts[2], f.pts[3]); ctx.stroke();
        break;
      case 'zap':
        ctx.strokeStyle = f.color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(f.pts[0], f.pts[1]);
        for (let i = 2; i < f.pts.length; i += 2) {
          const px = f.pts[i - 2], py = f.pts[i - 1], qx = f.pts[i], qy = f.pts[i + 1];
          for (let j = 1; j <= 4; j++) {
            const t = j / 4;
            ctx.lineTo(px + (qx - px) * t + (j < 4 ? rand(-10, 10) : 0), py + (qy - py) * t + (j < 4 ? rand(-10, 10) : 0));
          }
        }
        ctx.stroke();
        break;
      case 'flame': {
        const k = 1 - a;
        const x = f.x + (f.tx - f.x) * k, y = f.y + (f.ty - f.y) * k;
        ctx.fillStyle = k < 0.5 ? '#ffd166' : '#ff6b35';
        ctx.beginPath(); ctx.arc(x, y, f.s * (0.6 + k), 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'boom':
        ctx.fillStyle = 'rgba(255,170,60,0.5)';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.1 - a * 0.5), 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 4;
        ctx.stroke();
        break;
      case 'spark':
        ctx.fillStyle = f.color;
        ctx.beginPath(); ctx.arc(f.x, f.y, 9 * a + 2, 0, Math.PI * 2); ctx.fill();
        break;
      case 'ring':
        ctx.strokeStyle = f.color; ctx.lineWidth = 6 * a;
        ctx.beginPath(); ctx.arc(f.x, f.y, 30 + (1 - a) * 50, 0, Math.PI * 2); ctx.stroke();
        break;
    }
  }
  ctx.globalAlpha = 1;
  for (const t of S.texts) {
    ctx.globalAlpha = clamp(t.life / t.max * 1.5, 0, 1);
    text(t.str, t.x, t.y, t.size, t.color, 'center', FONT_UI, 5);
  }
  ctx.globalAlpha = 1;
}

function drawBanner() {
  const b = S.banner;
  if (!b) return;
  const k = 1 - b.life / b.max;
  const inK = clamp(k / 0.15, 0, 1);
  const outK = clamp((1 - k) / 0.2, 0, 1);
  const a = Math.min(inK, outK);
  const cy = (FIELD_T + FIELD_B) / 2 - 40;
  ctx.save();
  ctx.globalAlpha = a;
  if (b.style === 'boss') {
    const y0 = cy - 20, bh = 130;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, y0, W, bh); ctx.clip();
    ctx.fillStyle = '#c8203a'; ctx.fillRect(0, y0, W, bh);
    ctx.fillStyle = '#e8475d';
    const off = (S.time * 90) % 64;
    for (let x = -bh + off - 64; x < W + bh; x += 64) {
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + 30, y0); ctx.lineTo(x + 30 - bh * 0.6, y0 + bh); ctx.lineTo(x - bh * 0.6, y0 + bh); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#ff8597';
    ctx.fillRect(0, y0 - 5, W, 5); ctx.fillRect(0, y0 + bh, W, 5);
    const d = MON[b.mon];
    drawMon({ type: b.mon, d, x: W / 2, y: y0 - 34, r: 64 * (0.6 + 0.4 * inK), anim: S.time, bite: 0, slowT: 0, flash: 0, hp: 1, maxHp: 1 });

    if (b.sub) text(b.sub, W / 2, y0 + 108, 24, '#ffe1e6', 'center', FONT_UI, 5, 660);
    ctx.restore();
    return;
  }
  ctx.translate(W / 2, cy);
  ctx.rotate(-0.05);
  ctx.scale(0.7 + 0.3 * inK, 0.7 + 0.3 * inK);
  ctx.fillStyle = 'rgba(36,20,12,0.82)';
  ctx.fillRect(-W, -64, W * 2, b.sub ? 128 : 100);
  ctx.fillStyle = b.color;
  ctx.fillRect(-W, -70, W * 2, 8);
  ctx.fillRect(-W, (b.sub ? 64 : 36), W * 2, 8);
  text(b.title, 0, b.sub ? -16 : -12, 64, '#ffffff', 'center', FONT_BIG, 8, 660);
  if (b.sub) text(b.sub, 0, 36, 28, b.color, 'center', FONT_UI, 5, 660);
  ctx.restore();
}

function wrapText(str, x, y, maxW, lineH, size, color, font = FONT_UI) {
  ctx.font = `${size}px ${font}`;
  const lines = [];
  let cur = '';
  for (const w of str.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (!cur || ctx.measureText(t).width <= maxW) cur = t;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  lines.forEach((ln, i) => text(ln, x, y + i * lineH, size, color, 'center', font, 0, maxW));
}

// Icons for cards and upgrades, centered on (x, y), about s pixels tall
function drawIcon(kind, x, y, s) {
  const k = s / 80;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  switch (kind) {
    case 'atk':
      ctx.rotate(0.7);
      ctx.translate(0, 6);
      ctx.fillStyle = '#e8edf5';
      ctx.beginPath(); ctx.moveTo(-11, -12); ctx.lineTo(-11, -40); ctx.lineTo(0, -54); ctx.lineTo(11, -40); ctx.lineTo(11, -12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(-5, -42, 4, 26);
      ctx.fillStyle = '#ffc93c'; rr(-24, -14, 48, 12, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8a5a30'; rr(-6, -2, 12, 28, 4); ctx.fill(); ctx.stroke();
      break;
    case 'spd': case 'chain':
      ctx.fillStyle = kind === 'spd' ? '#ffd23f' : '#c39bff';
      ctx.beginPath(); ctx.moveTo(6, -36); ctx.lineTo(-20, 6); ctx.lineTo(-2, 6); ctx.lineTo(-8, 36); ctx.lineTo(20, -6); ctx.lineTo(2, -6); ctx.closePath();
      ctx.fill(); ctx.stroke();
      break;
    case 'crit':
      ctx.fillStyle = '#ff6b4a';
      ctx.beginPath();
      for (let j = 0; j < 16; j++) { const a = j * Math.PI / 8, r = j % 2 ? 16 : 36; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
      break;
    case 'coin':
      ctx.restore(); drawFishCoin(x, y, s * 0.38); return;
    case 'hp':
      ctx.fillStyle = '#ff5d73';
      ctx.beginPath(); ctx.moveTo(0, 32);
      ctx.bezierCurveTo(-40, 6, -30, -32, 0, -14); ctx.bezierCurveTo(30, -32, 40, 6, 0, 32);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-14, -10, 7, 4, -0.6, 0, Math.PI * 2); ctx.fill();
      break;
    case 'armor':
      ctx.fillStyle = '#9fb3d1';
      ctx.beginPath(); ctx.moveTo(-28, -30); ctx.lineTo(28, -30); ctx.lineTo(28, 0); ctx.quadraticCurveTo(26, 26, 0, 36); ctx.quadraticCurveTo(-26, 26, -28, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#6c7ee1'; ctx.beginPath(); ctx.moveTo(-14, -18); ctx.lineTo(14, -18); ctx.lineTo(14, 0); ctx.quadraticCurveTo(12, 14, 0, 20); ctx.quadraticCurveTo(-12, 14, -14, 0); ctx.closePath(); ctx.fill();
      break;
    case 'luck':
      ctx.fillStyle = '#5ec46a';
      for (const [dx, dy] of [[-13, -13], [13, -13], [-13, 13], [13, 13]]) { ctx.beginPath(); ctx.arc(dx, dy, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = '#5ec46a'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      break;
    case 'xp':
      ctx.restore(); drawGem(x, y, s * 0.42); return;
    case 'fish':
      ctx.strokeStyle = '#8a5a30'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-34, 34); ctx.lineTo(30, -30); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 5;
      ctx.save(); ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = '#ff9f45'; ctx.beginPath(); ctx.ellipse(0, 0, 26, 14, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(38, -12); ctx.lineTo(38, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-14, -3, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      break;
    case 'aoe':
      ctx.fillStyle = '#ff9f1c';
      ctx.beginPath();
      for (let j = 0; j < 12; j++) { const a = j * Math.PI / 6, r = j % 2 ? 22 : 38; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
      break;
    case 'chill':
      ctx.strokeStyle = '#5cc4e0'; ctx.lineWidth = 7;
      for (let j = 0; j < 3; j++) {
        ctx.save(); ctx.rotate(j * Math.PI / 3);
        ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(0, 34); ctx.moveTo(-9, -24); ctx.lineTo(0, -16); ctx.lineTo(9, -24);
        ctx.moveTo(-9, 24); ctx.lineTo(0, 16); ctx.lineTo(9, 24); ctx.stroke();
        ctx.restore();
      }
      break;
    case 'free':
      ctx.fillStyle = '#ff7aa2'; rr(-30, -12, 60, 44, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff9fbe'; rr(-34, -26, 68, 16, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(-6, -26, 12, 58);
      ctx.strokeRect(-6, -26, 12, 58);
      break;
  }
  ctx.restore();
}

// TV-style frame used for upgrade tiles and card art
function drawScreenTile(x, y, w, h, glow) {
  ctx.fillStyle = '#2b1a12';
  rr(x, y, w, h, 18); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  const g = ctx.createRadialGradient(x + w / 2, y + h / 2, 4, x + w / 2, y + h / 2, w * 0.7);
  g.addColorStop(0, glow ? '#fff4d6' : '#dfe7f2');
  g.addColorStop(1, glow ? '#f2c46b' : '#8fa3c4');
  ctx.fillStyle = g;
  rr(x + 9, y + 9, w - 18, h - 18, 12); ctx.fill();
}

function drawPick() {
  const P = S.pick, k = clamp(P.t / 0.25, 0, 1);
  overlay(0.78);
  text(L('lvUp'), W / 2, 210, 76, '#ffc93c', 'center', FONT_BIG, 10, 660);
  text(`${L('lvLabel', S.level)} · ${L('pickHint')}`, W / 2, 290, 28, '#ffffff', 'center', FONT_UI, 5, 660);
  P.cards.forEach((c, i) => {
    const r = cardRect(i);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.translate(0, (1 - k) * 60 * (i + 1));
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(r.x, r.y + 8, r.w, r.h, 20); ctx.fill();
    ctx.fillStyle = '#fff6e6'; rr(r.x, r.y, r.w, r.h, 20); ctx.fill();
    const col = c.rare ? '#9b6be0' : '#5b8fd9';
    ctx.fillStyle = col; rr(r.x + 10, r.y + 10, r.w - 20, 176, 14); ctx.fill();
    ctx.fillStyle = shadeTone(col, 0.82); rr(r.x + 10, r.y + 150, r.w - 20, 36, 14); ctx.fill();
    drawScreenTile(r.x + r.w / 2 - 60, r.y + 28, 120, 112, true);
    if (c.ti != null) drawCat(r.x + r.w / 2, r.y + 88, 92, c.ti, 1, S.time, 0);
    else drawIcon(c.icon, r.x + r.w / 2, r.y + 84, 76);
    const owned = S.picks[c.id] || 0;
    if (owned) text(`x${owned}`, r.x + r.w - 24, r.y + 168, 22, '#ffffff', 'right', FONT_BIG, 4);
    text(cardName(c), r.x + r.w / 2, r.y + 222, 28, INK, 'center', FONT_BIG, 0, r.w - 24);
    wrapText(cardDesc(c), r.x + r.w / 2, r.y + 268, r.w - 30, 30, 22, '#7a5a44');
    if (i === P.rec) {
      ctx.fillStyle = '#8a4fe0'; rr(r.x - 6, r.y + r.h - 58, r.w + 12, 44, 12); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      text(L('recommended'), r.x + r.w / 2, r.y + r.h - 35, 22, '#ffffff', 'center', FONT_BIG, 4, r.w);
    }
    ctx.lineWidth = 5; ctx.strokeStyle = i === P.rec ? '#ffc93c' : INK;
    rr(r.x, r.y, r.w, r.h, 20); ctx.stroke();
    ctx.restore();
  });
  drawButton(UI.reroll, '#6c7ee1', L('reroll', S.rerolls), null, S.rerolls > 0, 32);
}

function drawReveal() {
  const R = S.reveal, k = clamp(R.t / 0.3, 0, 1);
  ctx.save();
  ctx.fillStyle = '#ff8a2a';
  ctx.fillRect(0, 0, W, H);
  ctx.translate(W / 2, H / 2);
  ctx.rotate(-0.5);
  const cols = ['#fff3c4', '#ffc56b', '#ff9f3a', '#ffd88a'];
  const off = (S.time * 60) % 520;
  for (let i = -12; i < 12; i++) {
    ctx.fillStyle = cols[((i % 4) + 4) % 4];
    ctx.fillRect(i * 130 + off, -1400, 130, 2800);
  }
  ctx.restore();
  ctx.save();
  ctx.translate(W / 2, 640);
  ctx.scale(0.4 + 0.6 * k, 0.4 + 0.6 * k);
  ctx.rotate(Math.sin(S.time * 1.5) * 0.08);
  ctx.beginPath();
  for (let j = 0; j < 8; j++) { const a = -Math.PI / 4 + j * Math.PI / 4, r = j % 2 ? 80 : 240; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
  const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 240);
  g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#ffb11f');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 14; ctx.strokeStyle = '#fff6a8'; ctx.stroke();
  ctx.restore();
  drawCat(W / 2, 640, 230 * (0.5 + 0.5 * k), R.ti, 3, S.time, 0);
  for (const [sx, sy, sz, c] of [[90, 280, 40, '#fff6a8'], [620, 880, 34, '#7fe3ff'], [130, 980, 26, '#ffe066'], [600, 330, 22, '#7fe3ff']]) {
    ctx.globalAlpha = 0.6 + Math.sin(S.time * 4 + sx) * 0.4;
    sparkle(sx, sy, sz, c);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,248,230,0.88)';
  rr(110, 220, W - 220, 230, 28); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#f0a040'; ctx.stroke();
  text(gradeName(3), W / 2, 260, 32, '#ffffff', 'center', FONT_BIG, 6);
  text(L('tag_' + TYPES[R.ti].id), W / 2, 318, 34, '#a8641a', 'center', FONT_BIG, 0, 640);
  text(unitName(R.ti), W / 2, 392, 84, '#7a3e0c', 'center', FONT_BIG, 0, 660);
  if (R.t > 0.5) {
    ctx.globalAlpha = 0.6 + Math.sin(S.time * 5) * 0.4;
    text(L('tapContinue'), W / 2, 1060, 30, '#ffffff', 'center', FONT_UI, 6);
    ctx.globalAlpha = 1;
  }
}

function drawGoldPill(x, y) {
  ctx.fillStyle = 'rgba(20,10,6,0.75)';
  rr(x, y, 220, 56, 28); ctx.fill();
  drawFishCoin(x + 30, y + 28, 18);
  text(meta.gold.toLocaleString(), x + 200, y + 30, 30, '#ffffff', 'right', FONT_BIG);
}

function drawShop() {
  overlay(0.9);
  drawButton(UI.back, '#6b4a3a', L('back'), null, true, 28);
  text(L('upgrade'), W / 2 - 10, 58, 40, '#ffffff', 'center', FONT_BIG, 6, 300);
  drawGoldPill(W - 244, 30);
  META.forEach((m, i) => {
    const r = shopRow(i), lv = metaLv(m.id), maxed = lv >= m.max;
    ctx.fillStyle = '#4a2f22'; rr(r.x, r.y, r.w, r.h, 20); ctx.fill();
    drawScreenTile(r.x + 12, r.y + 12, 128, 128, maxed);
    drawIcon(m.id, r.x + 76, r.y + 76, 70);
    text(L('mn_' + m.id), r.x + 160, r.y + 38, 30, '#ffffff', 'left', FONT_BIG, 0, 300);
    text(`Lv ${lv}/${m.max}`, r.x + 160, r.y + 74, 22, '#ffc93c', 'left', FONT_BIG);
    text(L('md_' + m.id), r.x + 160, r.y + 104, 21, '#d9bc94', 'left', FONT_UI, 0, 300);
    const now = m.fmt(m.val(lv));
    text(maxed ? now : `${now} → ${m.fmt(m.val(lv + 1))}`, r.x + 160, r.y + 132, 22, '#fff0d8', 'left', FONT_BIG, 0, 320);
    const btn = shopBtn(i);
    if (maxed) drawButton(btn, '#6b4a3a', L('maxed'), null, false, 30);
    else {
      const cost = metaCost(m, lv);
      drawButton(btn, '#f0b429', L('buy'), `${cost.toLocaleString()} G`, meta.gold >= cost, 28);
    }
  });
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawField();
  drawRange();
  for (const m of S.mons) drawMon(m);
  drawWall();
  drawSlots();
  drawProjs();
  drawFx();
  drawGems();
  drawHud();
  drawPanel();
  if (S.drag && S.drag.moved) {
    const u = S.slots[S.drag.from];
    if (u) drawCat(S.drag.x, S.drag.y, 84, u.type, u.grade, S.time, 0, 0.92);
  }
  drawToast();
  drawBanner();
  if (S.phase === 'play' && S.reveal) drawReveal();
  else if (S.phase === 'play' && S.pick) drawPick();
  if (S.phase === 'title') drawTitle();
  else if (S.phase === 'over') drawOver();
  else if (S.phase === 'shop') drawShop();
  else if (S.paused) drawPause();
}

// ───────────────────────── Input ─────────────────────────
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function slotAt(p) {
  for (let i = 0; i < SLOTS.length; i++) {
    const s = SLOTS[i];
    if (Math.abs(p.x - s.x) <= CELL / 2 + 4 && Math.abs(p.y - s.y) <= CELL / 2 + 22) return i;
  }
  return -1;
}

function togglePause() {
  if (S.phase !== 'play') return;
  S.paused = !S.paused;
  S.drag = null;
}

canvas.addEventListener('pointerdown', e => {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  const p = toGame(e);
  canvas.setPointerCapture(e.pointerId);

  if (inRect(p, UI.mute)) {
    muted = !muted;
    try { localStorage.setItem('nyang-mute', muted ? '1' : '0'); } catch (err) { /* storage unavailable */ }
    sfx('click');
    return;
  }
  if (inRect(p, UI.lang)) {
    lang = lang === 'en' ? 'ko' : 'en';
    try { localStorage.setItem('nyang-lang', lang); } catch (err) { /* storage unavailable */ }
    canvas.setAttribute('aria-label', L('aria'));
    sfx('click');
    return;
  }
  if (S.phase === 'title') {
    UI.big.y = 860; UI.big2.y = 980;
    if (inRect(p, UI.big)) { sfx('click'); startGame(); }
    else if (inRect(p, UI.big2)) { sfx('click'); openShop(); }
    return;
  }
  if (S.phase === 'over') {
    UI.big.y = 810; UI.big2.y = 930;
    if (inRect(p, UI.big)) { sfx('click'); startGame(); }
    else if (inRect(p, UI.big2)) { sfx('click'); openShop(); }
    return;
  }
  if (S.phase === 'shop') {
    if (inRect(p, UI.back)) { sfx('click'); S.phase = S.shopReturn; return; }
    for (let i = 0; i < META.length; i++) {
      if (!inRect(p, shopBtn(i))) continue;
      if (buyMeta(i)) { sfx('merge'); const b = shopBtn(i); burst(b.x + b.w / 2, b.y + b.h / 2, '#ffc93c', 18); }
      else { sfx('click'); if (metaLv(META[i].id) < META[i].max) toast(L('notEnoughGold')); }
    }
    return;
  }
  if (inRect(p, UI.pause)) { sfx('click'); togglePause(); return; }
  if (S.paused) {
    UI.big.y = 560; UI.big2.y = 690;
    if (inRect(p, UI.big)) { sfx('click'); S.paused = false; }
    else if (inRect(p, UI.big2)) { sfx('click'); newGame('title'); }
    return;
  }
  if (S.reveal) { if (S.reveal.t > 0.4) closeReveal(); return; }
  if (S.pick) {
    if (S.pick.t < 0.25) return;
    for (let i = 0; i < S.pick.cards.length; i++) if (inRect(p, cardRect(i))) { choosePick(i); return; }
    if (inRect(p, UI.reroll)) reroll();
    return;
  }
  if (inRect(p, UI.draw)) { doDraw(); return; }
  if (inRect(p, UI.speed)) { S.speed = S.speed === 1 ? 2 : 1; sfx('click'); return; }
  const i = slotAt(p);
  if (i >= 0 && S.slots[i]) {
    S.drag = { from: i, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false };
  } else {
    S.sel = -1;
  }
});

canvas.addEventListener('pointermove', e => {
  if (!S.drag) return;
  const p = toGame(e);
  S.drag.x = p.x;
  S.drag.y = p.y;
  if (!S.drag.moved && Math.hypot(p.x - S.drag.sx, p.y - S.drag.sy) > 10) { S.drag.moved = true; S.sel = -1; }
});

function endDrag(e) {
  const d = S.drag;
  if (!d) return;
  S.drag = null;
  if (!S.slots[d.from]) return;
  if (!d.moved) { S.sel = S.sel === d.from ? -1 : d.from; return; }
  const p = toGame(e);
  if (inRect(p, UI.sell)) { sell(d.from); return; }
  const to = slotAt(p);
  if (to < 0 || to === d.from) return;
  const a = S.slots[d.from], b = S.slots[to];
  if (!b) { S.slots[to] = a; S.slots[d.from] = null; sfx('click'); }
  else if (canMerge(a, b)) merge(d.from, to);
  else { S.slots[to] = a; S.slots[d.from] = b; sfx('click'); }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', () => { S.drag = null; });

window.addEventListener('keydown', e => {
  if (S.phase === 'play' && S.pick && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) { choosePick(Number(e.code.slice(5)) - 1); return; }
  if (S.phase === 'play' && S.reveal && (e.code === 'Space' || e.code === 'Enter')) { closeReveal(); e.preventDefault(); return; }
  if (e.code === 'Space' || e.code === 'Enter') {
    if (S.phase === 'title' || S.phase === 'over') { initAudio(); startGame(); }
    else doDraw();
    e.preventDefault();
  } else if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.phase === 'play') S.paused = true;
});

// ───────────────────────── Loop ─────────────────────────
paintBackground();
newGame('title');
canvas.setAttribute('aria-label', L('aria'));
resize();
window.addEventListener('resize', resize);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(`40px "Black Han Sans"`), document.fonts.load(`20px "Jua"`)]).catch(() => {});
}

const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  acc += dt * (S.phase === 'play' && !S.paused ? S.speed : 1);
  let n = 0;
  while (acc >= STEP && n < 8) { update(STEP); acc -= STEP; n++; }
  if (n === 8) acc = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Test hook
window.__nyang = {
  get S() { return S; }, startGame, update, doDraw, merge, sell, canMerge, drawCost, choosePick, closeReveal, openShop, openPick, openReveal,
};
})();
</script>
