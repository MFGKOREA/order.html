<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SR.KEY Test">
<title>SR.KEY Test</title>
<style>
/* 발주앱 KREAM 스타일: 회색 바탕 + 흰 카드, 검정 강조, 짧은 밑줄 탭. 포인트는 아웃백 레드 */
:root {
  --bg: #f4f4f4;
  --surface: #ffffff;
  --fill: rgba(0, 0, 0, .05);
  --fill-2: #f4f4f4;
  --fg: #222222;
  --muted: #707070;
  --faint: #a3a3a3;
  --line: #ebebeb;
  --red: #c8102e;
  --red-ink: #ffffff;
  --red-soft: #fbeaec;
  --red-text: #b00e28;
  --ok: #16804a; --ok-bg: #ebf7f0; --ok-cell: #41b979;
  --scrim: rgba(0, 0, 0, .38);
  --lift: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --font: "Microsoft GothicNeo", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #141414; --fill: rgba(255,255,255,.08); --fill-2: #1f1f1f;
    --fg: #f2f2f2; --muted: #8b8b8b; --faint: #5c5c5c; --line: #262626;
    --red: #ff3b4f; --red-ink: #1a0306; --red-soft: #2c1215; --red-text: #ff7a87;
    --ok: #4cc38a; --ok-bg: #10261b; --ok-cell: #3aa874;
    --scrim: rgba(0, 0, 0, .6); --lift: 0 0 0 1px #262626;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #141414; --fill: rgba(255,255,255,.08); --fill-2: #1f1f1f;
  --fg: #f2f2f2; --muted: #8b8b8b; --faint: #5c5c5c; --line: #262626;
  --red: #ff3b4f; --red-ink: #1a0306; --red-soft: #2c1215; --red-text: #ff7a87;
  --ok: #4cc38a; --ok-bg: #10261b; --ok-cell: #3aa874;
  --scrim: rgba(0, 0, 0, .6); --lift: 0 0 0 1px #262626;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; overflow-x: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
@supports (overflow: clip) { html, body { overflow-x: clip; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.5; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
}
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button:not(:disabled) { transition-property: transform, filter, background-color, box-shadow, color; transition-duration: 120ms; transition-timing-function: var(--ease); }
button:not(:disabled):active { transform: scale(.97); filter: brightness(.96); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
svg { display: block; }
h1, h2, h3 { text-wrap: balance; }
p, li, .sub, .exp { text-wrap: pretty; }
@media (pointer: coarse) { input, textarea { font-size: 16px !important; } }

.app { max-width: 480px; margin: 0 auto; }
.view { padding: calc(12px + env(safe-area-inset-top)) 0 calc(112px + env(safe-area-inset-bottom)); }
.view[hidden] { display: none; }
.view.in { animation: viewin 260ms var(--ease); }
@keyframes viewin { from { opacity: 0; transform: translateY(8px); } }

/* ───── 홈 ───── */
.hdr { margin: 14px 2px 18px; }
.hdr h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.15; }
.hdr p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }

.stats { background: var(--surface); border-radius: 20px; padding: 18px 18px 16px; margin-bottom: 12px; }
.stats .row { display: grid; grid-template-columns: 1.25fr 1fr 1fr; }
.stats .row > div { display: grid; gap: 1px; align-content: start; }
.stats .row > div + div { border-left: 1px solid var(--line); padding-left: 16px; }
.stats span { font-size: 12px; font-weight: 600; color: var(--muted); }
.stats b { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
.stats b small { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 1px; letter-spacing: -0.01em; }
.stats .wrongn b { color: var(--red); }
.meter { display: flex; gap: 2px; height: 6px; margin-top: 14px; border-radius: 6px; overflow: hidden; background: var(--fill); }
.meter i { display: block; height: 100%; transition: flex-grow 700ms cubic-bezier(.33,1,.68,1); }
.meter .m-ok { background: var(--fg); }
.meter .m-bad { background: var(--red); }
.meter .m-rest { background: transparent; }
.legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

.resume { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; background: var(--surface); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; box-shadow: inset 0 0 0 1.5px var(--fg); }
.resume .t { flex: 1; min-width: 0; display: grid; gap: 1px; }
.resume b { font-size: 14.5px; font-weight: 800; }
.resume span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.resume em { flex: none; font-style: normal; font-size: 13px; font-weight: 800; color: var(--red-text); }
.resume[hidden] { display: none; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
.seg button { position: relative; border: 0; background: none; padding: 13px 0 14px; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button + button::before { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 1px; background: var(--line); }
.seg button[aria-selected="true"] { color: var(--fg); font-weight: 800; }
.seg button::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 44px; height: 3px; border-radius: 3px 3px 0 0; background: var(--red); translate: -50% 0; scale: 0 1; transition: scale 200ms var(--ease); }
.seg button[aria-selected="true"]::after { scale: 1 1; }
.seg .cnt { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--red); color: var(--red-ink); font-size: 11px; font-weight: 800; vertical-align: 1px; }
.seg .cnt:empty { display: none; }

.panel { background: var(--surface); border-radius: 20px; padding: 18px 16px; }
.panel[hidden] { display: none; }
.panel h3 { margin: 0 0 4px; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.panel .sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.field + .field { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.field > small { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { position: relative; border: 0; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); padding: 8px 15px; min-height: 38px; font-size: 14px; font-weight: 500; }
.chips button::after { content: ""; position: absolute; inset: -4px 0; }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--surface); box-shadow: none; font-weight: 700; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; border: 0; background: none; padding: 0; text-align: left; min-height: 44px; }
.toggle b { display: block; font-size: 14.5px; font-weight: 700; }
.toggle span { display: block; font-size: 12.5px; color: var(--muted); }
.sw { flex: none; position: relative; width: 46px; height: 28px; border-radius: 14px; background: var(--fill); transition: background-color 180ms var(--ease); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: translate 200ms var(--ease); }
.toggle[aria-checked="true"] .sw { background: var(--fg); }
.toggle[aria-checked="true"] .sw::after { translate: 18px 0; }

/* 자료·단원 */
.src + .src { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.src-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.src-h b { font-size: 14.5px; font-weight: 800; }
.src-h b small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.src-h button { position: relative; border: 0; background: none; padding: 6px 2px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.src-h button::after { content: ""; position: absolute; inset: -8px -6px; }
.chrow { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; align-items: center; gap: 4px 10px; width: 100%; border: 0; background: none; text-align: left; padding: 9px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 12px; min-height: 48px; }
.chrow .ck { width: 22px; height: 22px; border-radius: 7px; box-shadow: inset 0 0 0 1.5px var(--faint); display: grid; place-items: center; transition: background-color 150ms, box-shadow 150ms; }
.chrow .ck svg { width: 14px; height: 14px; stroke: var(--surface); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 120ms; }
.chrow[aria-pressed="true"] .ck { background: var(--fg); box-shadow: none; }
.chrow[aria-pressed="true"] .ck svg { opacity: 1; }
.chrow .nm { font-size: 14.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chrow .nm small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.chrow em { font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.chrow .mini { grid-column: 2 / -1; height: 3px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.chrow .mini i { display: block; height: 100%; background: var(--fg); border-radius: 3px; }

/* 오답노트 목록 */
.wlist { display: grid; gap: 8px; }
.witem { background: var(--fill-2); border-radius: 12px; padding: 11px 12px; display: grid; gap: 3px; }
.witem small { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.witem small em { font-style: normal; color: var(--red-text); white-space: nowrap; }
.witem span { font-size: 14px; font-weight: 600; }
.empty { text-align: center; padding: 22px 8px 10px; color: var(--muted); font-size: 14px; }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.foot { display: flex; justify-content: center; margin-top: 18px; }
.linkbtn { position: relative; border: 0; background: none; padding: 8px 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

/* ───── 아래 고정 버튼 (아웃백 레드) ───── */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 14px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: linear-gradient(to top, var(--bg) 72%, transparent); pointer-events: none; }
.dock .in { max-width: 480px; margin: 0 auto; display: flex; gap: 8px; pointer-events: auto; }
.btn { flex: 1; min-height: 54px; border: 0; border-radius: 14px; background: var(--red); color: var(--red-ink); font-size: 16.5px; font-weight: 800; letter-spacing: -0.02em; }
.btn:disabled { background: var(--fill); color: var(--faint); cursor: default; }
.btn.ghost { flex: 0 0 auto; padding: 0 18px; background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); font-weight: 700; }
.btn.dark { background: var(--fg); color: var(--surface); }
.btn .k { font-size: 12px; font-weight: 700; opacity: .7; margin-left: 6px; }
@media (pointer: coarse) { .btn .k { display: none; } }

/* ───── 문제 화면 ───── */
.qtop { display: flex; align-items: center; gap: 12px; margin: 6px 0 12px; }
.x { border: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.x svg { width: 18px; height: 18px; stroke: var(--fg); stroke-width: 2.2; fill: none; stroke-linecap: round; }
.qprog { flex: 1; display: grid; gap: 7px; }
.qprog .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 800; }
.qprog .t span { color: var(--muted); font-weight: 600; }
.qprog .t span b { color: var(--fg); font-weight: 800; }
.track { display: flex; gap: 3px; height: 5px; }
.track i { flex: 1; border-radius: 3px; background: var(--fill); transition: background-color 250ms; }
.track i.ok { background: var(--fg); }
.track i.bad { background: var(--red); }
.track i.now { background: var(--faint); }
.track.long { gap: 0; border-radius: 3px; overflow: hidden; background: var(--fill); }
.track.long i { border-radius: 0; }

.card { background: var(--surface); border-radius: 22px; padding: 20px 18px 18px; transform-origin: 50% 50%; box-shadow: var(--lift); }
.card.flip-out { animation: flipout 160ms ease-in forwards; }
.card.flip-in { animation: flipin 280ms var(--ease); }
@keyframes flipout { to { transform: perspective(1000px) rotateY(90deg); opacity: .7; } }
@keyframes flipin { from { transform: perspective(1000px) rotateY(-90deg); opacity: .7; } }
.card.pop { animation: pop 380ms cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { 40% { transform: scale(1.012); } }
.card.enter { animation: enter 280ms var(--ease); }
@keyframes enter { from { transform: translateX(28px); opacity: 0; } }
.card.shake { animation: shake 320ms ease-out; }
@keyframes shake { 20% { transform: translateX(-6px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tag { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; background: var(--fill-2); color: var(--muted); }
.tag.ch { background: var(--fg); color: var(--surface); }
.tag.var { background: var(--red-soft); color: var(--red-text); }
.qtext { margin: 0 0 20px; font-size: 20px; font-weight: 800; line-height: 1.45; letter-spacing: -0.035em; text-wrap: pretty; }

.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: 14px; padding: 13px 14px; min-height: 56px; font-size: 15.5px; font-weight: 600; line-height: 1.4; }
.opt .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); font-size: 13px; font-weight: 800; color: var(--muted); transition: background-color 150ms, color 150ms; }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg); }
.opt[aria-pressed="true"] .n { background: var(--fg); color: var(--surface); }
.opt.right { box-shadow: inset 0 0 0 2px var(--ok); background: var(--ok-bg); }
.opt.right .n { background: var(--ok); color: #fff; }
.opt.dim { opacity: .45; }
.opt:disabled { cursor: default; color: var(--fg); }
.opt .mk { font-size: 12px; font-weight: 800; color: var(--ok); }

.sa label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.sa label span { font-weight: 600; color: var(--faint); }
.sa textarea { display: block; width: 100%; min-height: 120px; resize: none; border: 0; border-radius: 14px; background: var(--fill-2); padding: 14px; font-size: 15.5px; line-height: 1.6; outline: none; transition: background-color 150ms, box-shadow 150ms; }
.sa textarea:focus { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--fg); }
.sa textarea[readonly] { background: var(--fill-2); box-shadow: none; color: var(--muted); }
.sa .hint { margin: 8px 2px 0; font-size: 12.5px; color: var(--muted); }
/* 주관식: 키보드에 가리지 않게 버튼을 입력칸 바로 아래에 */
.sa-act { display: flex; gap: 8px; margin-top: 14px; scroll-margin-bottom: 16px; }
.sa-act .btn { min-height: 50px; }
.dock:has(.in:empty) { display: none; }

/* 정답일 때 */
.okbox { margin-top: 16px; border-radius: 14px; background: var(--ok-bg); padding: 13px 14px; }
.okbox .h { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 800; font-size: 15px; }
.okbox .h svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.okbox .h svg path { stroke-dasharray: 22; stroke-dashoffset: 22; animation: draw 260ms 120ms ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.okbox p { margin: 6px 0 0; font-size: 14px; color: var(--fg); opacity: .85; }
.okbox details { margin-top: 10px; }
.okbox summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ok); list-style: none; }
.okbox summary::-webkit-details-marker { display: none; }
.okbox summary::after { content: " 보기"; }
.okbox details[open] summary::after { content: " 접기"; }
.okbox details p { font-size: 13.5px; }

/* 해답 카드 */
.ans .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -20px -18px 18px; padding: 14px 18px; background: var(--red); color: var(--red-ink); border-radius: 22px 22px 0 0; }
.ans .head b { font-size: 16px; font-weight: 800; }
.ans .head span { font-size: 12.5px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ans .q { margin: 0 0 18px; font-size: 14.5px; font-weight: 600; color: var(--muted); }
.blk { margin-bottom: 18px; }
.blk > small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.correct { display: flex; gap: 8px; align-items: flex-start; font-size: 19px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.4; }
.correct svg { flex: none; width: 22px; height: 22px; margin-top: 2px; stroke: var(--ok); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.model { font-size: 15px; font-weight: 500; line-height: 1.65; }
.mine { font-size: 14.5px; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); white-space: pre-wrap; }
.mine.none { text-decoration: none; font-style: italic; color: var(--faint); }
.kws { display: flex; flex-wrap: wrap; gap: 6px; }
.kw { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 11px; }
.kw.hit { background: var(--ok-bg); color: var(--ok); }
.kw.miss { box-shadow: inset 0 0 0 1.5px var(--red); color: var(--red-text); }
.kwnote { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.exp { background: var(--fill-2); border-radius: 14px; padding: 14px; font-size: 14.5px; line-height: 1.65; }
.exp b { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.meta { display: flex; justify-content: space-between; gap: 10px; margin: 12px 2px 0; font-size: 12px; color: var(--muted); }
.meta em { font-style: normal; font-weight: 700; color: var(--red-text); text-align: right; }

/* ───── 결과 ───── */
.res { background: var(--surface); border-radius: 22px; padding: 24px 18px 18px; margin-bottom: 12px; }
.res .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.res .big { font-size: 54px; font-weight: 800; letter-spacing: -0.05em; line-height: .95; }
.res .big small { font-size: 22px; color: var(--muted); font-weight: 700; letter-spacing: -0.02em; margin-left: 2px; }
.res .rate { text-align: right; }
.res .rate b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
.res .rate span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.res .msg { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(14px, 1fr)); gap: 4px; margin-top: 16px; }
.cells i { aspect-ratio: 1; border-radius: 4px; background: var(--ok-cell); }
.cells i.bad { background: var(--red); }
.cells i.skip { background: var(--fill); box-shadow: inset 0 0 0 1.5px var(--red); }
.bych { display: grid; gap: 10px; }
.bych .r { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; font-size: 14px; }
.bych .r span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.bych .r b { font-weight: 800; }
.bych .r .mini { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--red-soft); overflow: hidden; }
.bych .r .mini i { display: block; height: 100%; background: var(--fg); border-radius: 4px; }
.panel + .panel { margin-top: 12px; }
.rw { border-top: 1px solid var(--line); }
.rw:first-of-type { border-top: 0; }
.rw summary { display: grid; grid-template-columns: minmax(0,1fr) 16px; gap: 10px; align-items: center; padding: 12px 0; cursor: pointer; list-style: none; }
.rw summary::-webkit-details-marker { display: none; }
.rw summary small { display: block; font-size: 11.5px; font-weight: 700; color: var(--red-text); }
.rw summary span { font-size: 14px; font-weight: 600; }
.rw summary svg { width: 16px; height: 16px; stroke: var(--muted); stroke-width: 2.2; fill: none; stroke-linecap: round; transition: rotate 200ms var(--ease); }
.rw[open] summary svg { rotate: 180deg; }
.rw .body { padding: 0 0 14px; display: grid; gap: 8px; }
.rw .body .a { font-size: 15px; font-weight: 800; }
.rw .body .a::before { content: "정답 "; font-size: 12px; font-weight: 700; color: var(--ok); }
.rw .body p { margin: 0; font-size: 13.5px; color: var(--muted); }

/* ───── 시트 (확인창) ───── */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 200ms; }
.sheet-bg.open { opacity: 1; }
.sheet-bg[hidden] { display: none; }
.sheet { width: 100%; max-width: 480px; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 20px calc(16px + env(safe-area-inset-bottom)); translate: 0 100%; transition: translate 280ms var(--ease); }
.sheet-bg.open .sheet { translate: 0 0; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 18px; }
.sheet h2 { margin: 0 0 6px; font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
.sheet p { margin: 0 0 20px; font-size: 14px; color: var(--muted); }
.sheet .row { display: flex; gap: 8px; }
.sheet .btn.ghost { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  .view.in, .card.flip-out, .card.flip-in, .card.pop, .card.enter, .card.shake, .okbox .h svg path { animation: none; stroke-dashoffset: 0; }
  .seg button::after, .sheet, .sheet-bg, .meter i, .sw::after { transition: none; }
}
</style>
</head>
<body>
<div class="app">

  <!-- 홈 -->
  <section class="view" id="v-home">
    <header class="hdr">
      <h1>SR.KEY Test</h1>
      <p id="h-sub">교육자료로 만든 필기 대비 문제</p>
    </header>

    <div class="stats" aria-label="학습 현황">
      <div class="row">
        <div><span>푼 문제</span><b id="st-done">0</b></div>
        <div><span>정답률</span><b id="st-rate">–</b></div>
        <div class="wrongn"><span>오답노트</span><b id="st-wrong">0</b></div>
      </div>
      <div class="meter" aria-hidden="true"><i class="m-ok" id="m-ok"></i><i class="m-bad" id="m-bad"></i><i class="m-rest" id="m-rest"></i></div>
      <div class="legend" aria-hidden="true"><span><i style="background:var(--fg)"></i>최근에 맞힘</span><span><i style="background:var(--red)"></i>오답노트</span><span><i style="background:var(--fill);box-shadow:inset 0 0 0 1px var(--line)"></i>안 푼 문제</span></div>
    </div>

    <button class="resume" id="resume" hidden><div class="t"><b>이어서 풀기</b><span id="resume-s"></span></div><em id="resume-n"></em></button>

    <div class="seg" role="tablist" aria-label="푸는 방법">
      <button role="tab" aria-selected="true" data-tab="all">전체 랜덤</button>
      <button role="tab" aria-selected="false" data-tab="ch">자료·단원</button>
      <button role="tab" aria-selected="false" data-tab="wrong">오답노트<span class="cnt" id="tab-wrong"></span></button>
    </div>

    <div class="panel" id="p-all" role="tabpanel">
      <div class="field">
        <small>문제 수</small>
        <div class="chips" id="cnt-chips">
          <button aria-pressed="false" data-n="10">10문제</button>
          <button aria-pressed="true" data-n="20">20문제</button>
          <button aria-pressed="false" data-n="50">50문제</button>
          <button aria-pressed="false" data-n="0">전부</button>
        </div>
      </div>
      <div class="field">
        <small>문제 유형</small>
        <div class="chips" id="type-chips">
          <button aria-pressed="true" data-t="">섞어서</button>
          <button aria-pressed="false" data-t="mc">객관식만</button>
          <button aria-pressed="false" data-t="sa">주관식만</button>
        </div>
      </div>
      <div class="field">
        <button class="toggle" id="fresh" role="switch" aria-checked="true"><div><b>안 푼 문제 먼저</b><span>한 번도 안 푼 문제부터 나와요</span></div><i class="sw"></i></button>
      </div>
    </div>

    <div class="panel" id="p-ch" role="tabpanel" hidden>
      <h3>자료·단원 고르기</h3>
      <p class="sub">고른 단원에서만 나와요. 막대는 최근에 맞힌 비율이에요.</p>
      <div id="chlist"></div>
    </div>

    <div class="panel" id="p-wrong" role="tabpanel" hidden>
      <h3>오답노트</h3>
      <p class="sub">틀린 문제는 숫자·보기·묻는 방향을 바꾼 변형 문제로 다시 나와요. 맞히면 목록에서 빠져요.</p>
      <div class="wlist" id="wlist"></div>
    </div>

    <div class="foot"><button class="linkbtn" id="reset">기록 초기화</button></div>
  </section>

  <!-- 문제 -->
  <section class="view" id="v-quiz" hidden>
    <div class="qtop">
      <button class="x" id="quit" aria-label="그만 풀기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="qprog">
        <div class="t"><span id="q-pos"></span><span id="q-score"></span></div>
        <div class="track" id="q-track" aria-hidden="true"></div>
      </div>
    </div>
    <article class="card" id="card" aria-live="polite"></article>
  </section>

  <!-- 결과 -->
  <section class="view" id="v-result" hidden>
    <header class="hdr"><h1 id="r-title">다 풀었어요</h1></header>
    <div class="res" id="res"></div>
    <div class="panel" id="r-ch"></div>
    <div class="panel" id="r-wrong"></div>
  </section>
</div>

<div class="dock"><div class="in" id="dock"></div></div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="grab"></div>
    <h2 id="sh-t"></h2>
    <p id="sh-d"></p>
    <div class="row"><button class="btn ghost" id="sh-no"></button><button class="btn" id="sh-yes"></button></div>
  </div>
</div>

<script src="srkey-questions.js"></script>
<script>
"use strict";
const BANK = (window.SRKEY_BANK || []).filter(q => q && q.id && q.q);
const SRC_ORDER = ["Sr.KEY/AKM", "KEY/AKM", "Step1 Hand Book", "Step2 서버·버서", "Step2 호스트·캐셔", "Step2 바", "Step4 FM/KM", "Step5 RM/MP"];
const byId = Object.fromEntries(BANK.map(q => [q.id, q]));
const chKey = q => q.src + "|" + q.ch;

/* ───── 저장: 폰 안에만. 막혀 있어도 앱은 동작 ───── */
const KEY = "srkey.v2";
let S = { st: {}, run: null, opt: { n: 20, t: "", fresh: true } };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
// st[id] = { n 푼 횟수, c 맞힌 횟수, w 오답노트에 있음, wn 틀린 횟수, last 최근 정답, nv 다음엔 변형으로 }
const st = id => (S.st[id] ||= { n: 0, c: 0, w: false, wn: 0, last: null, nv: false });

/* ───── 채점 ───── */
const norm = s => String(s).toLowerCase().normalize("NFC").replace(/[\s·,.\/()\[\]\-~:;'"!?①②③④⑤⑥→+*#%&_=]/g, "");
function gradeSA(d, text) {
  const t = norm(text);
  const hits = d.kw.map(g => g.some(w => { const k = norm(w); return k && t.includes(k); }));
  const n = hits.filter(Boolean).length;
  return { ok: n >= d.need, hits, n };
}

/* ───── 도구 ───── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const ICON = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
};
function show(id) {
  document.querySelectorAll(".view").forEach(v => { const on = v.id === id; v.hidden = !on; v.classList.toggle("in", on && !reduced()); });
  scrollTo(0, 0);
}
const dock = html => { $("#dock").innerHTML = html; };
function sheet(title, desc, yes, no) {
  return new Promise(res => {
    const bg = $("#sheet");
    $("#sh-t").textContent = title; $("#sh-d").textContent = desc; $("#sh-yes").textContent = yes; $("#sh-no").textContent = no;
    bg.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => bg.classList.add("open")));
    $("#sh-yes").focus();
    const done = v => { bg.classList.remove("open"); setTimeout(() => { bg.hidden = true; }, reduced() ? 0 : 280); bg.onclick = $("#sh-yes").onclick = $("#sh-no").onclick = null; document.removeEventListener("keydown", esc_); res(v); };
    const esc_ = e => { if (e.key === "Escape") done(false); };
    document.addEventListener("keydown", esc_);
    $("#sh-yes").onclick = () => done(true);
    $("#sh-no").onclick = () => done(false);
    bg.onclick = e => { if (e.target === bg) done(false); };
  });
}

/* ───── 자료·단원 구조 ───── */
const SOURCES = [...new Set([...SRC_ORDER.filter(s => BANK.some(q => q.src === s)), ...BANK.map(q => q.src)])];
const CHAPTERS = SOURCES.map(src => ({ src, chs: [...new Set(BANK.filter(q => q.src === src).map(q => q.ch))] }));

/* ───── 홈 ───── */
let tab = "all";
const chSel = new Set();

function home() {
  const total = BANK.length;
  const done = BANK.filter(q => S.st[q.id]?.n).length;
  const okNow = BANK.filter(q => S.st[q.id]?.last === true && !S.st[q.id]?.w).length;
  const wrong = BANK.filter(q => S.st[q.id]?.w);
  const tot = BANK.reduce((a, q) => a + (S.st[q.id]?.n || 0), 0);
  const cor = BANK.reduce((a, q) => a + (S.st[q.id]?.c || 0), 0);
  $("#h-sub").textContent = `교육자료 ${SOURCES.length}권 · ${total}문제 · 주방 내용 제외`;
  $("#st-done").innerHTML = `${done}<small>/${total}</small>`;
  $("#st-rate").innerHTML = tot ? `${Math.round(cor / tot * 100)}<small>%</small>` : "–";
  $("#st-wrong").textContent = wrong.length;
  $("#tab-wrong").textContent = wrong.length || "";
  $("#m-ok").style.flexGrow = okNow; $("#m-bad").style.flexGrow = wrong.length; $("#m-rest").style.flexGrow = Math.max(total - okNow - wrong.length, 0);

  const r = S.run;
  const canResume = r && r.list?.length && r.i < r.list.length && r.list.every(x => byId[x.id]);
  $("#resume").hidden = !canResume;
  if (canResume) { $("#resume-s").textContent = r.label; $("#resume-n").textContent = `${r.i + 1} / ${r.list.length}`; }

  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  ["all", "ch", "wrong"].forEach(t => { $("#p-" + t).hidden = tab !== t; });
  document.querySelectorAll("#cnt-chips button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === S.opt.n));
  document.querySelectorAll("#type-chips button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === S.opt.t));
  $("#fresh").setAttribute("aria-checked", S.opt.fresh);

  $("#chlist").innerHTML = CHAPTERS.map(({ src, chs }) => {
    const qs = BANK.filter(q => q.src === src);
    const all = chs.every(c => chSel.has(src + "|" + c));
    return `<div class="src"><div class="src-h"><b>${esc(src)}<small>${qs.length}문제</small></b><button data-src="${esc(src)}">${all ? "선택 해제" : "전체 선택"}</button></div>` +
      chs.map(c => {
        const k = src + "|" + c, cq = qs.filter(q => q.ch === c);
        const right = cq.filter(q => S.st[q.id]?.last === true).length;
        return `<button class="chrow" data-k="${esc(k)}" aria-pressed="${chSel.has(k)}"><span class="ck">${ICON.check}</span><span class="nm">${esc(c)}<small>${cq.length}</small></span><em>${right}/${cq.length}</em><span class="mini"><i style="width:${right / cq.length * 100}%"></i></span></button>`;
      }).join("") + `</div>`;
  }).join("");

  $("#wlist").innerHTML = wrong.length
    ? wrong.sort((a, b) => (S.st[b.id].wn || 0) - (S.st[a.id].wn || 0)).map(q => `<div class="witem"><small><span>${esc(q.src)} · ${esc(q.ch)}</span><em>${S.st[q.id].wn || 1}번 틀림</em></small><span>${esc(q.q)}</span></div>`).join("")
    : `<div class="empty"><b>틀린 문제가 없어요</b>문제를 풀다 틀리면 여기에 모여요.</div>`;

  let label = "문제 풀기 시작", dis = !BANK.length;
  if (tab === "all") { const n = pool().length; label = `${n}문제 풀기`; dis = !n; }
  if (tab === "ch") { const n = BANK.filter(q => chSel.has(chKey(q))).length; label = n ? `고른 단원 ${n}문제 풀기` : "단원을 골라 주세요"; dis = !n; }
  if (tab === "wrong") { label = wrong.length ? `오답 ${wrong.length}문제 다시 풀기` : "오답노트가 비어 있어요"; dis = !wrong.length; }
  dock(`<button class="btn" id="start" ${dis ? "disabled" : ""}>${label}</button>`);
  $("#start").onclick = () => start(tab);
  if (!$("#v-home").hidden) return;
  show("v-home");
}

function pool() {
  let qs = BANK.filter(q => !S.opt.t || q.type === S.opt.t);
  qs = shuffle(qs);
  if (S.opt.fresh) qs.sort((a, b) => (S.st[a.id]?.n ? 1 : 0) - (S.st[b.id]?.n ? 1 : 0));
  return S.opt.n ? qs.slice(0, S.opt.n) : qs;
}

function start(mode) {
  let list, label;
  if (mode === "wrong") {
    list = shuffle(BANK.filter(q => S.st[q.id]?.w)).map(q => ({ id: q.id, v: !!q.v && S.st[q.id].nv !== false }));
    label = "오답노트";
  } else if (mode === "ch") {
    list = shuffle(BANK.filter(q => chSel.has(chKey(q)))).map(q => ({ id: q.id, v: false }));
    const names = [...chSel].map(k => k.split("|")[1]);
    label = names.length > 2 ? `${names.slice(0, 2).join(", ")} 외 ${names.length - 2}개` : names.join(", ");
  } else {
    list = pool().map(q => ({ id: q.id, v: false }));
    label = `전체 랜덤 ${list.length}문제`;
  }
  S.run = { list, i: 0, res: [], label, phase: "ask" };
  save();
  show("v-quiz");
  ask(true);
}

/* ───── 문제 ───── */
const cur = () => { const r = S.run, x = r.list[r.i], q = byId[x.id]; const d = x.v && q.v ? { ...q, ...q.v } : q; return { x, q, d }; };
let state = {};

function header() {
  const r = S.run, n = r.list.length, ok = r.res.filter(v => v === 1).length;
  $("#q-pos").innerHTML = `<b>${r.i + 1}</b> / ${n}`;
  $("#q-score").innerHTML = `맞힘 <b>${ok}</b>`;
  const tr = $("#q-track");
  tr.classList.toggle("long", n > 30);
  tr.innerHTML = r.list.map((_, k) => `<i class="${r.res[k] === 1 ? "ok" : r.res[k] != null ? "bad" : k === r.i ? "now" : ""}"></i>`).join("");
}

function ask(first) {
  const { x, q, d } = cur();
  state = { sel: null, order: d.type === "mc" ? shuffle([0, 1, 2, 3]) : null, done: false };
  S.run.phase = "ask"; save();
  header();
  const card = $("#card");
  card.className = "card";
  const tags = `<div class="tags"><span class="tag ch">${esc(q.ch)}</span><span class="tag">${esc(q.src)}</span><span class="tag">${d.type === "mc" ? "객관식" : "주관식"}</span>${x.v ? '<span class="tag var">변형 문제</span>' : ""}</div>`;
  if (d.type === "mc") {
    card.innerHTML = tags + `<h2 class="qtext">${esc(d.q)}</h2><div class="opts" role="group" aria-label="보기">${state.order.map((oi, k) =>
      `<button class="opt" data-oi="${oi}" aria-pressed="false"><span class="n">${k + 1}</span><span>${esc(d.opts[oi])}</span><span class="mk"></span></button>`).join("")}</div>`;
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b));
  } else {
    card.innerHTML = tags + `<h2 class="qtext">${esc(d.q)}</h2><div class="sa"><label for="ans">내 답 <span id="ans-n">0자</span></label><textarea id="ans" placeholder="생각나는 내용을 최대한 적어 주세요" enterkeyhint="done"></textarea><p class="hint">핵심 키워드가 ${d.need}개 이상 들어가면 정답이에요. 띄어쓰기·순서는 상관없어요.</p></div>`;
    card.insertAdjacentHTML("beforeend", `<div class="sa-act" id="sa-act"><button class="btn ghost" id="skip">모르겠어요</button><button class="btn" id="check" disabled>정답 확인</button></div>`);
    const ta = $("#ans");
    const reveal = () => setTimeout(() => $("#sa-act")?.scrollIntoView({ block: "nearest", behavior: reduced() ? "auto" : "smooth" }), 320);
    ta.onfocus = reveal;
    ta.oninput = () => { $("#check").disabled = !ta.value.trim(); $("#ans-n").textContent = ta.value.trim().length + "자"; ta.style.height = "auto"; ta.style.height = Math.max(120, ta.scrollHeight) + "px"; if (document.activeElement === ta) $("#sa-act")?.scrollIntoView({ block: "nearest" }); };
  }
  if (!first && !reduced()) { void card.offsetWidth; card.classList.add("enter"); }
  if (d.type === "mc") dock(`<button class="btn ghost" id="skip">모르겠어요</button><button class="btn" id="check" disabled>정답 확인<span class="k">Enter</span></button>`);
  else dock("");
  $("#check").onclick = check;
  $("#skip").onclick = () => check(true);
}

function pick(b) {
  if (state.done) return;
  state.sel = +b.dataset.oi;
  $("#card").querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", o === b));
  $("#check").disabled = false;
}

function check(skipped) {
  if (state.done) return;
  state.done = true;
  if (document.activeElement?.tagName === "TEXTAREA") document.activeElement.blur(); // 키보드 닫기
  const { x, q, d } = cur();
  const s = st(q.id);
  let ok, mine, sa;
  if (skipped === true) { ok = false; mine = ""; if (d.type === "sa") sa = gradeSA(d, ""); }
  else if (d.type === "mc") { ok = state.sel === d.a; mine = d.opts[state.sel]; }
  else { mine = $("#ans").value.trim(); sa = gradeSA(d, mine); ok = sa.ok; }

  s.n++; s.last = ok;
  if (ok) { s.c++; if (S.run.label === "오답노트" || x.v) s.w = false; }
  else { s.w = true; s.wn = (s.wn || 0) + 1; s.nv = !x.v; } // 원문제를 틀리면 다음엔 변형, 변형을 틀리면 다음엔 원문제
  S.run.res[S.run.i] = ok ? 1 : skipped === true ? 2 : 0;
  S.run.phase = "answered";
  save();
  header();

  const last = S.run.i === S.run.list.length - 1;
  const card = $("#card");
  card.classList.remove("enter", "pop", "shake");
  if (ok) {
    if (d.type === "mc") card.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (+b.dataset.oi === d.a) { b.classList.add("right"); b.querySelector(".mk").textContent = "정답"; } else b.classList.add("dim"); });
    else { $("#ans").readOnly = true; $("#ans").blur(); $("#sa-act")?.remove(); }
    const extra = d.type === "sa"
      ? `<div class="kws" style="margin-top:10px">${d.kw.map((g, i) => `<span class="kw ${sa.hits[i] ? "hit" : "miss"}">${esc(g[0])}</span>`).join("")}</div><details><summary>모범 답안</summary><p>${esc(d.model)}</p></details>`
      : "";
    card.insertAdjacentHTML("beforeend", `<div class="okbox"><div class="h">${ICON.check}${x.v ? "변형 문제도 맞혔어요. 오답노트에서 뺐어요" : "정답이에요"}</div><p>${esc(d.exp)}</p>${extra}</div>`);
    if (!reduced()) { void card.offsetWidth; card.classList.add("pop"); }
  } else {
    try { navigator.vibrate?.(skipped === true ? 0 : 40); } catch (e) {}
    const swap = () => { card.innerHTML = answerCard(x, q, d, mine, sa, skipped === true); card.classList.remove("flip-out"); if (!reduced()) { void card.offsetWidth; card.classList.add("flip-in"); } };
    if (reduced()) swap();
    else { void card.offsetWidth; card.classList.add("flip-out"); setTimeout(swap, 160); }
  }
  dock(`<button class="btn ${ok ? "dark" : ""}" id="next">${last ? "결과 보기" : "다음 문제"}<span class="k">Enter</span></button>`);
  $("#next").onclick = next;
  setTimeout(() => $("#next")?.focus({ preventScroll: true }), 50);
}

function next() {
  if (S.run.i >= S.run.list.length - 1) return result();
  S.run.i++; save(); scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" }); ask();
}

function answerCard(x, q, d, mine, sa, skipped) {
  let body;
  if (d.type === "mc") {
    body = `<div class="blk"><small>정답</small><div class="correct">${ICON.check}<span>${esc(d.opts[d.a])}</span></div></div>
      <div class="blk"><small>${skipped ? "내 답" : "내가 고른 답"}</small><div class="mine ${skipped ? "none" : ""}">${skipped ? "모르겠어요" : esc(mine)}</div></div>`;
  } else {
    body = `<div class="blk"><small>핵심 키워드 · ${sa.n}개 맞힘, ${d.need}개 이상이면 정답</small><div class="kws">${d.kw.map((g, i) => `<span class="kw ${sa.hits[i] ? "hit" : "miss"}">${esc(g[0])}</span>`).join("")}</div>
      <p class="kwnote">초록은 내 답에 있던 키워드, 빨간 테두리는 빠진 키워드예요.</p></div>
      <div class="blk"><small>모범 답안</small><div class="model">${esc(d.model)}</div></div>
      <div class="blk"><small>내 답</small><div class="mine ${mine ? "" : "none"}">${mine ? esc(mine) : skipped ? "모르겠어요" : "(비어 있음)"}</div></div>`;
  }
  const page = q.page ? ` ${q.page}쪽` : "";
  return `<div class="ans"><div class="head"><b>${skipped ? "해답 카드" : "오답 · 해답 카드"}</b><span>${esc(q.ch)}</span></div>
    <p class="q">${esc(d.q)}</p>${body}
    <div class="exp"><b>해설</b>${esc(d.exp)}</div>
    <div class="meta"><span>${esc(q.src)}${page}</span><em>${x.v ? "오답노트에 남겨 둘게요" : "오답노트에 담았어요"}</em></div></div>`;
}

/* ───── 결과 ───── */
function result() {
  const r = S.run, n = r.list.length, ok = r.res.filter(v => v === 1).length, rate = Math.round(ok / n * 100);
  const wrongIdx = r.list.map((x, k) => ({ x, k })).filter(o => r.res[o.k] !== 1);
  $("#r-title").textContent = rate >= 80 ? "잘했어요" : rate >= 60 ? "조금만 더" : "다시 한 번 볼까요";
  $("#res").innerHTML = `<div class="top"><div class="big">${ok}<small>/ ${n}</small></div><div class="rate"><b>${rate}%</b><span>정답률</span></div></div>
    <div class="cells" aria-label="문제별 결과">${r.res.map(v => `<i class="${v === 1 ? "" : v === 2 ? "skip" : "bad"}"></i>`).join("")}</div>
    <p class="msg">${wrongIdx.length ? `틀린 ${wrongIdx.length}문제는 오답노트에 담겼어요. 다음엔 바뀐 문제로 나와요.` : "모두 맞혔어요. 다른 단원도 풀어 보세요."}</p>`;

  const g = {};
  r.list.forEach((x, k) => { const c = byId[x.id].ch; (g[c] ||= [0, 0]); g[c][1]++; if (r.res[k] === 1) g[c][0]++; });
  const rows = Object.entries(g).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]);
  $("#r-ch").innerHTML = `<h3>단원별</h3><p class="sub">${rows.length > 8 ? `약한 단원 8개만 보여요 (전체 ${rows.length}개)` : "약한 단원이 위에 있어요."}</p><div class="bych">${rows.slice(0, 8).map(([c, [a, t]]) => `<div class="r"><span>${esc(c)}</span><b>${a}/${t}</b><div class="mini"><i style="width:${a / t * 100}%"></i></div></div>`).join("")}</div>`;
  $("#r-ch").hidden = rows.length < 2;

  $("#r-wrong").innerHTML = wrongIdx.length
    ? `<h3>틀린 문제</h3><p class="sub">눌러서 정답과 해설을 다시 볼 수 있어요.</p>${wrongIdx.map(({ x }) => {
        const q = byId[x.id], d = x.v && q.v ? { ...q, ...q.v } : q;
        const a = d.type === "mc" ? d.opts[d.a] : d.model;
        return `<details class="rw"><summary><div><small>${esc(q.ch)}</small><span>${esc(d.q)}</span></div>${ICON.chev}</summary><div class="body"><div class="a">${esc(a)}</div><p>${esc(d.exp)}</p></div></details>`;
      }).join("")}`
    : "";
  $("#r-wrong").hidden = !wrongIdx.length;

  S.run = null; save();
  const hasWrong = BANK.some(q => S.st[q.id]?.w);
  dock(`<button class="btn ghost" id="r-home">홈</button><button class="btn" id="r-next">${hasWrong ? "오답노트 풀기" : "새로 풀기"}</button>`);
  $("#r-home").onclick = () => { tab = "all"; show("v-home"); home(); };
  $("#r-next").onclick = () => hasWrong ? start("wrong") : start("all");
  show("v-result");
}

/* ───── 이벤트 ───── */
document.querySelector(".seg").onclick = e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.tab; home(); } };
$("#cnt-chips").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.opt.n = +b.dataset.n; save(); home(); };
$("#type-chips").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.opt.t = b.dataset.t; save(); home(); };
$("#fresh").onclick = () => { S.opt.fresh = !S.opt.fresh; save(); home(); };
$("#chlist").onclick = e => {
  const s = e.target.closest("[data-src]");
  if (s) { const g = CHAPTERS.find(c => c.src === s.dataset.src); const keys = g.chs.map(c => g.src + "|" + c); const all = keys.every(k => chSel.has(k)); keys.forEach(k => all ? chSel.delete(k) : chSel.add(k)); return home(); }
  const b = e.target.closest(".chrow"); if (!b) return;
  const k = b.dataset.k; chSel.has(k) ? chSel.delete(k) : chSel.add(k); home();
};
$("#resume").onclick = () => { show("v-quiz"); if (S.run.phase === "answered") { S.run.i++; if (S.run.i >= S.run.list.length) return result(); } ask(true); };
$("#quit").onclick = async () => {
  const left = S.run.list.length - S.run.i - (S.run.phase === "answered" ? 1 : 0);
  if (await sheet("그만 풀까요?", `남은 ${left}문제는 홈에서 이어서 풀 수 있어요. 푼 기록은 저장돼요.`, "그만 풀기", "계속 풀기")) { show("v-home"); home(); }
};
$("#reset").onclick = async () => {
  if (await sheet("기록을 모두 지울까요?", "푼 문제, 정답률, 오답노트가 모두 사라지고 되돌릴 수 없어요.", "모두 지우기", "취소")) { S.st = {}; S.run = null; save(); home(); }
};
document.addEventListener("keydown", e => {
  if ($("#v-quiz").hidden || !$("#sheet").hidden || e.isComposing) return;
  if (e.target.tagName === "TEXTAREA" && !(e.key === "Enter" && (e.metaKey || e.ctrlKey))) return;
  if (!state.done && /^[1-4]$/.test(e.key)) { const b = $("#card").querySelectorAll(".opt")[+e.key - 1]; if (b) pick(b); }
  else if (e.key === "Enter") { e.preventDefault(); if (state.done) next(); else if (!$("#check").disabled) check(); }
});

home();
show("v-home");
</script>
</body>
</html>
