<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--wrap-end-->
<title>Kitchen Layout Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen drafting desk. Toolbar on top, plan canvas fills the room, a tabbed side panel (bottom sheet on phones). */
:root{
  --bg:#E9EEF0; --panel:#FFFFFF; --panel-2:#F4F7F8; --ink:#1A242C; --muted:#5B6873; --line:#D3DBE0;
  --canvas:#FBFCFC; --grid:#EBF0F2; --grid-major:#D5DEE2;
  --accent:#0E7A69; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC;
  --warn:#C9741C; --danger:#CF3B3B; --ok:#2E8A57;
  --cold:#2F6DB5; --hot:#C9502A; --wash:#13879A; --work:#5F6B77; --misc:#8A6A3E;
  --struct:#2A3137; --hood:#7A54BE; --zone:#9C7A42; --door:#46525C; --sel:#0E7A69; --magnet:#D6307F;
  --under-filter:none;
  --font-ui:"IBM Plex Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1316; --panel:#161C20; --panel-2:#1C2328; --ink:#E3E9EC; --muted:#93A1AA; --line:#2A343A;
    --canvas:#11171A; --grid:#182024; --grid-major:#243036;
    --accent:#3DC3A8; --accent-ink:#04211B; --accent-soft:#163A33;
    --warn:#E89A4A; --danger:#F06A6A; --ok:#58C08A;
    --cold:#6EA7EA; --hot:#F0855A; --wash:#4DC2D2; --work:#9AA7B2; --misc:#CDA772;
    --struct:#C7D0D6; --hood:#B394EA; --zone:#CCAA70; --door:#AEB9C1; --sel:#3DC3A8; --magnet:#F25CA2;
    --under-filter:invert(1) hue-rotate(180deg);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1316; --panel:#161C20; --panel-2:#1C2328; --ink:#E3E9EC; --muted:#93A1AA; --line:#2A343A;
  --canvas:#11171A; --grid:#182024; --grid-major:#243036;
  --accent:#3DC3A8; --accent-ink:#04211B; --accent-soft:#163A33;
  --warn:#E89A4A; --danger:#F06A6A; --ok:#58C08A;
  --cold:#6EA7EA; --hot:#F0855A; --wash:#4DC2D2; --work:#9AA7B2; --misc:#CDA772;
  --struct:#C7D0D6; --hood:#B394EA; --zone:#CCAA70; --door:#AEB9C1; --sel:#3DC3A8; --magnet:#F25CA2;
  --under-filter:invert(1) hue-rotate(180deg);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px}

/* ---------- toolbar ---------- */
.bar{grid-column:1 / -1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.eyebrow{font:500 10.5px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:3px 0 0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:7px;padding:6px 9px;font-size:13px;color:var(--ink);min-height:32px}
.seg button:hover{background:var(--panel-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.35;cursor:default;background:transparent}
.seg svg{width:16px;height:16px;flex:none}
#zoomLbl{min-width:58px;justify-content:center;font-family:var(--font-mono);font-size:12.5px}
.status{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;border:1px solid transparent;background:var(--panel)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb, var(--ok) 35%, transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb, var(--warn) 45%, transparent)}
.pill.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 45%, transparent)}
button.pill{cursor:pointer}

/* ---------- stage ---------- */
.stage{position:relative;min-width:0;min-height:0;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:none}
#cv line,#cv rect,#cv path,#cv circle,#cv ellipse,#cv polyline,#cv polygon{vector-effect:non-scaling-stroke}
#cv text{font-family:var(--font-ui);pointer-events:none}
#under{filter:var(--under-filter)}
.lib svg *{vector-effect:non-scaling-stroke}
#cv .it{cursor:grab}
#cv.panning,#cv.panning .it{cursor:grabbing}
#cv.tool-hand,#cv.tool-hand .it{cursor:grab}
#cv.tool-measure,#cv.tool-measure .it,#cv.tool-calib,#cv.tool-calib .it{cursor:crosshair}
#cv [data-h]{cursor:nwse-resize}
#cv [data-h="n"],#cv [data-h="s"]{cursor:ns-resize}
#cv [data-h="e"],#cv [data-h="w"]{cursor:ew-resize}
#cv [data-h="ne"],#cv [data-h="sw"]{cursor:nesw-resize}

.hud{position:absolute;left:12px;bottom:10px;display:flex;align-items:flex-end;gap:14px;pointer-events:none;font:500 11.5px/1 var(--font-mono);color:var(--muted)}
.scalebar{display:flex;flex-direction:column;gap:4px}
.scalebar b{display:block;height:6px;border:1.5px solid var(--ink);border-top:0;opacity:.75}
.coords{white-space:nowrap}
.qbar{position:absolute;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);z-index:3}
.qbar button{border:0;background:transparent;border-radius:7px;display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:12.5px;min-height:32px}
.qbar button:hover{background:var(--panel-2)}
.qbar button.danger{color:var(--danger)}
.qbar svg{width:15px;height:15px}
.floatcard{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.4);z-index:4;width:min(380px, calc(100% - 24px));display:flex;flex-direction:column;gap:8px}
.floatcard p{margin:0;font-size:13px;color:var(--muted)}
.floatcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-6px);background:var(--ink);color:var(--canvas);padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .18s, transform .18s;pointer-events:none;z-index:5;max-width:calc(100% - 24px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.grabbing{cursor:grabbing}
.v3bar{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:3}
.v3bar .btn{box-shadow:0 4px 14px -8px rgba(0,0,0,.35)}
.v3bar .btn.on{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.v3hint{position:absolute;right:12px;bottom:12px;font:500 11.5px/1.3 var(--font-mono);color:var(--muted);pointer-events:none;text-align:right}
.cap3d{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:min(300px, calc(100% - 24px));box-shadow:0 10px 30px -14px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:2px;z-index:3;font-size:13px}
.cap3d .r{display:flex;align-items:center;gap:6px;min-height:26px;opacity:.28;transition:opacity .45s cubic-bezier(.25,.8,.25,1)}
.cap3d .r.in{opacity:1}
.cap3d .r .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap3d .r .v{margin-left:auto;padding-left:10px;font-size:12.5px}
.cap3d .r.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:600}
.cap3d .r.tot .t{color:var(--muted);font-weight:500}
body.is3d .seg.only2d{display:none}
@media (prefers-reduced-motion: reduce){ .cap3d .r{transition:none} }

/* ---------- panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);flex:none}
.tabs button{border:0;background:transparent;padding:11px 4px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{overflow:auto;min-height:0;flex:1;padding:14px 14px 22px}
.pane{display:flex;flex-direction:column;gap:16px}
.pane h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.group{display:flex;flex-direction:column;gap:8px}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lib button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 8px;min-width:0}
.lib button:hover{border-color:var(--accent);background:var(--accent-soft)}
.lib svg{width:42px;height:30px;flex:none}
.lib span{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.lib b{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib small{font:11px var(--font-mono);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:34px;min-width:0}
input[type=number]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.unit{position:relative}
.unit input{padding-right:34px}
.unit::after{content:attr(data-u);position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--font-mono);color:var(--muted);pointer-events:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn svg{width:15px;height:15px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dirs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 2px;font-size:12px;min-height:34px}
.dirs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.empty p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.chip i{width:10px;height:10px;border-radius:3px;display:block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--panel-2);font-size:11.5px}
td.n,th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
tfoot td{font-weight:600;border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.saved{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.issue{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;font-size:13px}
.issue:hover{background:var(--panel-2)}
.issue b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue span{font:12px var(--font-mono);color:var(--muted);white-space:nowrap}
.issue.bad span{color:var(--danger)} .issue.warn span{color:var(--warn)}
.roles{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px}
.roles i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legno{display:inline-flex;flex:none;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font:600 11px var(--font-mono);color:#fff;margin-right:6px}
.saved .row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.saved .row div{flex:1;min-width:0;display:flex;flex-direction:column}
.saved .row b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved .row small{font:11px var(--font-mono);color:var(--muted)}
.saved .btn{min-height:30px;padding:4px 9px;font-size:12.5px}
details{border:1px solid var(--line);border-radius:9px;padding:8px 10px}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details[open] summary{margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0}

@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding-block:8px}
  .brand h1{font-size:15px}
  .brand .eyebrow{display:none}
  .seg button .t{display:none}
  .status{margin-left:0}
  .panel{max-height:46vh}
  .tabs button{font-size:12px;padding:10px 2px}
  .panel.collapsed .pbody{display:none}
  .coords{display:none}
}
@media (max-width: 600px){ .brand{display:none} .tools{gap:6px} .seg button{padding:6px 8px} }
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><span class="eyebrow">Kitchen Layout</span><h1>주방 배치 플래너</h1></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="보기">
        <button type="button" id="v2d" class="on" title="평면도로 편집">2D</button>
        <button type="button" id="v3d" title="입체로 보기">3D</button>
      </div>
      <div class="seg only2d" role="group" aria-label="도구">
        <button type="button" data-mode="select" class="on" title="선택 · 이동 (V)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 2l9.5 5.2-4.2 1.1L6.4 13z"/></svg><span class="t">선택</span></button>
        <button type="button" data-mode="hand" title="화면 이동 (H · 스페이스 누른 채 드래그)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 8V3.5a1 1 0 012 0V7m0-4.5a1 1 0 012 0V7m0-3.5a1 1 0 012 0V8m0-2.5a1 1 0 012 0V10c0 2.5-1.8 4.5-4.3 4.5H8.2C6.6 14.5 5.4 13.6 4.6 12L3 9a1 1 0 011.7-1z"/></svg><span class="t">이동</span></button>
        <button type="button" data-mode="measure" title="거리 재기 (M)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="5" width="13" height="6" rx="1"/><path d="M4.5 5v2.5M7 5v1.8M9.5 5v2.5M12 5v1.8"/></svg><span class="t">재기</span></button>
      </div>
      <div class="seg" role="group" aria-label="실행 취소">
        <button type="button" id="undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5L2.5 6.5l3 3"/><path d="M2.5 6.5H10a3.5 3.5 0 010 7H7"/></svg></button>
        <button type="button" id="redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5l3 3-3 3"/><path d="M13.5 6.5H6a3.5 3.5 0 000 7h3"/></svg></button>
      </div>
      <div class="seg only2d" role="group" aria-label="확대">
        <button type="button" id="zoomOut" title="축소" aria-label="축소"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 8h9"/></svg></button>
        <button type="button" id="zoomLbl" title="전체 보기 (F)">100%</button>
        <button type="button" id="zoomIn" title="확대" aria-label="확대"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
      </div>
      <div class="seg only2d" role="group" aria-label="밑그림">
        <button type="button" id="underBtn" title="원본 도면 밑그림 표시"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M1.5 9.5l3.5-3 3 2.5 2.5-2 4 3.5"/></svg><span class="t">밑그림</span></button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="주방 평면도" role="img">
      <g id="lUnder"><image id="under" preserveAspectRatio="none" style="pointer-events:none"/></g>
      <g id="lStatic"></g>
      <g id="lZone"></g>
      <g id="lItems"></g>
      <g id="lOver"></g>
      <g id="lOverlay"></g>
    </svg>
    <div class="hud"><div class="scalebar"><span id="sbLbl">1 m</span><b id="sbBar" style="width:60px"></b></div><span class="coords" id="coords"></span></div>
    <div class="qbar" id="qbar" hidden>

<script>
'use strict';
/* ============================================================
   Kitchen Layout Planner — plan units are millimetres.
   Items are axis-aligned boxes {x,y,w,h} in plan space; `rot`
   (0/90/180/270) says which side is the working front.
   ============================================================ */
const FLOORPLAN = "__FLOORPLAN_DATA_URI__";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = v => Math.round(v).toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const n1 = v => Math.round(v * 10) / 10;

const svg = $('#cv'), stage = $('#stage');
const L = { under: $('#under'), stat: $('#lStatic'), zone: $('#lZone'), items: $('#lItems'), over: $('#lOver'), overlay: $('#lOverlay') };

/* ---------- equipment types ---------- */
const TYPES = {
  worktable: { label: '작업대', cat: 'work' },
  sink: { label: '싱크대', cat: 'wash', n: '조 수' },
  handsink: { label: '손세척대', cat: 'wash' },
  dishwasher: { label: '식기세척기', cat: 'wash' },
  fridge: { label: '스탠드 냉장·냉동고', cat: 'cold', n: '도어 수' },
  fridgeTable: { label: '테이블 냉장·냉동고', cat: 'cold', n: '도어 수' },
  walkin: { label: '워크인 냉장·냉동실', cat: 'cold' },
  icemaker: { label: '제빙기', cat: 'cold' },
  range: { label: '가스렌지·화구', cat: 'hot', n: '화구 수' },
  fryer: { label: '튀김기', cat: 'hot', n: '조 수' },
  griddle: { label: '그리들', cat: 'hot' },
  oven: { label: '오븐', cat: 'hot' },
  kettle: { label: '국솥·밥솥', cat: 'hot' },
  hood: { label: '후드 (천장)', cat: 'hood', layer: 'overhead' },
  shelf: { label: '선반', cat: 'work' },
  overshelf: { label: '상부 선반 (벽걸이)', cat: 'work', layer: 'overhead' },
  bin: { label: '쓰레기통', cat: 'work' },
  table: { label: '테이블', cat: 'misc' },
  chair: { label: '의자', cat: 'misc' },
  locker: { label: '락커', cat: 'misc' },
  box: { label: '기타 장비', cat: 'work' },
  wall: { label: '벽', cat: 'struct', layer: 'struct' },
  column: { label: '기둥·샤프트', cat: 'struct', layer: 'struct' },
  door: { label: '문', cat: 'door', layer: 'door' },
  zone: { label: '구역 표시', cat: 'zone', layer: 'zone' },
};
const CAT_NAME = { cold: '냉장·냉동', hot: '가열', wash: '세척', work: '작업·보관', misc: '휴게·기타', hood: '후드', struct: '구조', door: '문', zone: '구역' };
const CAT_ORDER = ['cold', 'hot', 'wash', 'work', 'hood', 'misc', 'struct', 'door', 'zone'];
const layerOf = it => (TYPES[it.type] || TYPES.box).layer || 'floor';
const catOf = it => (TYPES[it.type] || TYPES.box).cat;
const spec = it => (it.rot % 180 === 0) ? [it.w, it.h] : [it.h, it.w];

const LIB = [
  ['냉장 · 냉동', [['fridge', '25박스 냉장고', 700, 800, { n: 2 }], ['fridge', '45박스 냉장고', 1260, 800, { n: 4 }], ['fridge', '65박스 냉장고', 1880, 800, { n: 6 }], ['fridgeTable', '테이블 냉장고 1200', 1200, 700], ['fridgeTable', '테이블 냉장고 1500', 1500, 700], ['fridgeTable', '테이블 냉동고 1500', 1500, 700], ['fridgeTable', '밧드 냉장고 1500', 1500, 700], ['icemaker', '제빙기', 600, 700], ['walkin', '워크인 냉장실', 2400, 2000], ['walkin', '워크인 냉동실', 1600, 2000]]],
  ['가열', [['range', '간택기 (1구)', 500, 600, { n: 1 }], ['range', '가스렌지 2구', 900, 600, { n: 2 }], ['range', '가스렌지 3구', 1350, 600, { n: 3 }], ['range', '중화렌지 2구', 1800, 900, { n: 2 }], ['fryer', '튀김기 1조', 400, 600, { n: 1 }], ['fryer', '튀김기 2조', 800, 600, { n: 2 }], ['griddle', '그리들', 900, 600], ['oven', '스팀 컨벡션 오븐', 900, 800], ['kettle', '국솥', 900, 900], ['kettle', '전기밥솥', 450, 450], ['hood', '후드', 2000, 1100]]],
  ['세척', [['sink', '1조 싱크대', 600, 700, { n: 1 }], ['sink', '2조 싱크대', 1200, 700, { n: 2 }], ['sink', '3조 싱크대', 1800, 700, { n: 3 }], ['handsink', '손세척대', 450, 400], ['dishwasher', '도어형 식기세척기', 650, 700], ['worktable', '세척 작업대', 1200, 700]]],
  ['작업 · 보관', [['worktable', '작업대 600', 600, 700], ['worktable', '작업대 900', 900, 700], ['worktable', '작업대 1200', 1200, 700], ['worktable', '작업대 1500', 1500, 700], ['worktable', '작업대 1800', 1800, 700], ['shelf', '선반 900', 900, 450], ['shelf', '선반 1200', 1200, 450], ['overshelf', '상부 선반', 1200, 350], ['worktable', '배식대 (패스)', 1500, 600], ['bin', '쓰레기통', 500, 500]]],
  ['구조 · 기타', [['wall', '벽 1000', 1000, 100], ['column', '기둥', 400, 400], ['door', '문 900', 900, 900], ['door', '문 800', 800, 800], ['zone', '구역 표시', 2000, 1500], ['table', '테이블', 800, 600], ['chair', '의자', 450, 450], ['locker', '락커', 900, 450], ['box', '기타 장비', 600, 600]]],
];

/* ---------- default layout: generated by analysis/trace.py from the supplied drawing ---------- */
const TRACE = __TRACE_JSON__;
const DEFAULT_ROOM = { ...TRACE.room };
const DEFAULT_UNDER = { ...TRACE.under };
function defaultItems() { return TRACE.items.map(i => ({ ...JSON.parse(JSON.stringify(i)), id: uid() })); }

/* ---------- state ---------- */
const DEFAULT_CFG = { grid: 50, magnet: true, checks: true, aisleMin: 800, labels: true, sizes: true };
const S = { room: { ...DEFAULT_ROOM }, items: [], cfg: { ...DEFAULT_CFG }, under: { ...DEFAULT_UNDER } };
let underData = FLOORPLAN;           // current underlay image (data URI)
let sel = new Set();
let mode = 'select';
let vb = { x: 0, y: 0, w: 12000, h: 9000 };
let drag = null, measure = null, guides = [];
let spaceDown = false;
let undoStack = [], redoStack = [];
let checks = { cols: [], aisles: [] };
let issueCursor = 0;
let pal = {};

const byId = id => S.items.find(i => i.id === id);
const selItems = () => S.items.filter(i => sel.has(i.id));
const snap = () => JSON.stringify({ room: S.room, items: S.items });
function checkpoint(prev) { undoStack.push(prev ?? snap()); if (undoStack.length > 120) undoStack.shift(); redoStack = []; updateHistoryBtns(); }
function restore(str) { const o = JSON.parse(str); S.room = o.room; S.items = o.items; sel = new Set([...sel].filter(id => byId(id))); }
function undo() { if (!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); changed(true); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); changed(true); }
function updateHistoryBtns() { $('#undo').disabled = !undoStack.length; $('#redo').disabled = !redoStack.length; }

/* ---------- persistence (this browser) ---------- */
const LS_STATE = 'klp.state.v2', LS_UNDER = 'klp.underimg.v1', LS_SAVES = 'klp.saves.v1';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
let saveTimer = 0;
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => lsSet(LS_STATE, JSON.stringify({ room: S.room, items: S.items, cfg: S.cfg, under: S.under })), 250); }
function loadLocal() {
  try {
    const raw = lsGet(LS_STATE); if (!raw) return false;
    const o = JSON.parse(raw); if (!o || !Array.isArray(o.items)) return false;
    S.room = o.room || { ...DEFAULT_ROOM }; S.items = o.items; S.cfg = { ...DEFAULT_CFG, ...(o.cfg || {}) }; S.under = { ...DEFAULT_UNDER, ...(o.under || {}) };
    if (S.under.custom) { const d = lsGet(LS_UNDER); if (d) underData = d; else { S.under = { ...DEFAULT_UNDER }; } }
    return true;
  } catch { return false; }
}

/* ---------- palette ---------- */
const TOKS = ['bg', 'panel', 'ink', 'muted', 'line', 'canvas', 'grid', 'grid-major', 'accent', 'warn', 'danger', 'ok', 'cold', 'hot', 'wash', 'work', 'misc', 'struct', 'hood', 'zone', 'door', 'sel', 'magnet'];
const LIGHT = { bg: '#E9EEF0', panel: '#FFFFFF', ink: '#1A242C', muted: '#5B6873', line: '#D3DBE0', canvas: '#FFFFFF', grid: '#EEF2F4', gridMajor: '#D9E1E5', accent: '#0E7A69', warn: '#C9741C', danger: '#CF3B3B', ok: '#2E8A57', cold: '#2F6DB5', hot: '#C9502A', wash: '#13879A', work: '#5F6B77', misc: '#8A6A3E', struct: '#2A3137', hood: '#7A54BE', zone: '#9C7A42', door: '#46525C', sel: '#0E7A69', magnet: '#D6307F' };
function readPalette() {
  const cs = getComputedStyle(document.documentElement); const p = {};
  for (const t of TOKS) p[t.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = cs.getPropertyValue('--' + t).trim();
  return p;
}

/* ============================================================
   SVG drawing
   ============================================================ */
const MONO = "IBM Plex Mono, ui-monospace, Menlo, monospace";
function symbol(it, Lw, D, P) {
  const c = P[catOf(it)] || P.work;
  const x0 = -Lw / 2, y0 = -D / 2, m = Math.min(Lw, D);
  const rect = (x, y, w, h, extra = '') => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(Math.max(w, 1))}" height="${n1(Math.max(h, 1))}" ${extra}/>`;
  const ln = (a, b, cc, d, w = 1, extra = '') => `<line x1="${n1(a)}" y1="${n1(b)}" x2="${n1(cc)}" y2="${n1(d)}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
  const base = (fo = 0.12) => rect(x0, y0, Lw, D, `fill="${c}" fill-opacity="${fo}" stroke="${c}" stroke-width="1.3"`);
  const front = () => { const y = D / 2 - Math.min(45, D * 0.07); return ln(x0 + Lw * 0.1, y, -x0 - Lw * 0.1, y, 2.6, 'stroke-linecap="round"'); };
  const stroke = (w = 1, extra = '') => `fill="none" stroke="${c}" stroke-width="${w}" ${extra}`;
  let s = '';
  switch (it.type) {
    case 'worktable': { const i = Math.min(70, m * 0.1); s = base() + rect(x0 + i, y0 + i, Lw - 2 * i, D - 2 * i, stroke(0.8, 'stroke-dasharray="4 3"')) + front(); break; }
    case 'sink': {
      const n = clamp(Math.round(it.n || (Lw >= 1500 ? 3 : Lw >= 1000 ? 2 : 1)), 1, 6);
      const mg = Math.min(70, Lw * 0.08), g = Math.min(60, Lw * 0.05);
      const bw = (Lw - 2 * mg - (n - 1) * g) / n, bh = D * 0.6, by = y0 + D * 0.14;
      s = base();
      for (let k = 0; k < n; k++) { const bx = x0 + mg + k * (bw + g); s += rect(bx, by, bw, bh, `rx="${n1(Math.min(50, bw * 0.15))}" fill="${P.canvas}" fill-opacity=".7" ${stroke(1.1)}`) + `<circle cx="${n1(bx + bw / 2)}" cy="${n1(by + bh / 2)}" r="${n1(Math.min(30, bw * 0.08))}" ${stroke(1)}/>`; }
      s += front(); break;
    }
    case 'handsink': s = base() + `<ellipse cx="0" cy="${n1(D * 0.05)}" rx="${n1(Lw * 0.32)}" ry="${n1(D * 0.27)}" ${stroke(1.1)}/>` + front(); break;

/* ---------- geometry checks ---------- */
const solid = it => { const l = layerOf(it); return l === 'floor' || l === 'struct'; };
function computeChecks() {
  const cols = [], aisles = [];

  const W = S.room.w, H = S.room.h;
  const kitchen = arr.filter(i => catOf(i) !== 'misc');
  for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
    const a = arr[i], b = arr[j]; if (layerOf(a) === 'struct' && layerOf(b) === 'struct') continue;
    const ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ix > 2 && iy > 2) cols.push({ a: a.id, b: b.id, x: Math.max(a.x, b.x), y: Math.max(a.y, b.y), w: ix, h: iy });
  }
  const min = S.cfg.aisleMin, low = 400;
  const walls = [{ id: '_l', x: -100, y: 0, w: 100, h: H }, { id: '_r', x: W, y: 0, w: 100, h: H }, { id: '_t', x: 0, y: -100, w: W, h: 100 }, { id: '_b', x: 0, y: H, w: W, h: 100 }];
  const all = kitchen.concat(walls);
  const blocked = (rx, ry, rw, rh, a, b) => all.some(c => c !== a && c !== b && c.x < rx + rw - 1 && c.x + c.w > rx + 1 && c.y < ry + rh - 1 && c.y + c.h > ry + 1);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j];
    if (a.id[0] === '_' && b.id[0] === '_') continue;
    const oy0 = Math.max(a.y, b.y), oy1 = Math.min(a.y + a.h, b.y + b.h);
    if (oy1 - oy0 > 150) {
      const [l, r] = a.x < b.x ? [a, b] : [b, a]; const g = r.x - (l.x + l.w);
      if (g >= low && g < min && !blocked(l.x + l.w, oy0, g, oy1 - oy0, a, b)) aisles.push({ a: a.id, b: b.id, x1: l.x + l.w, x2: r.x, y1: (oy0 + oy1) / 2, y2: (oy0 + oy1) / 2, g });
    }
    const ox0 = Math.max(a.x, b.x), ox1 = Math.min(a.x + a.w, b.x + b.w);

}

function bbox(list) {
  if (!list.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const i of list) { x0 = Math.min(x0, i.x); y0 = Math.min(y0, i.y); x1 = Math.max(x1, i.x + i.w); y1 = Math.max(y1, i.y + i.h); }

}

function clearances(b) {
  // nearest solid obstacle in four directions from box b
  const others = S.items.filter(i => solid(i) && !sel.has(i.id));
  const W = S.room.w, H = S.room.h, res = [];
  const ovY = i => i.y < b.y + b.h - 1 && i.y + i.h > b.y + 1, ovX = i => i.x < b.x + b.w - 1 && i.x + i.w > b.x + 1;

  if (b.y - T.v > 1) res.push({ x1: midX(T), y1: T.v, x2: midX(T), y2: b.y, g: b.y - T.v });
  if (B.v - (b.y + b.h) > 1) res.push({ x1: midX(B), y1: b.y + b.h, x2: midX(B), y2: B.v, g: B.v - b.y - b.h });
  return res;
}

}

}

  let cross = null; if (ANA.legs[3]?.pts && ANA.legs[1]?.pts) { const p = crossPoint(ANA.legs[3].pts, ANA.legs[1].pts); if (p) { cross = new T.Mesh(new T.RingGeometry(0.2, 0.3, 48), new T.MeshBasicMaterial({ color: new T.Color(P.danger), transparent: true, side: T.DoubleSide, depthWrite: false })); cross.rotation.x = -Math.PI / 2; cross.position.set(p.x * MM, 0.016, p.y * MM); cross.scale.setScalar(0.001); cross.renderOrder = 4; V3.routeG.add(cross); } }
  const t0 = rebuild && V3.show ? V3.show.t0 : performance.now();
  V3.show = { t0, legs, cross, cook: ANA.st.cook, th0: V3.show?.th0 ?? V3.sph.th };
  buildCaption(); $('#showBtn').classList.add('on'); $('#showLbl').textContent = '쇼 멈추기'; $('#showIco').setAttribute('d', 'M4 4h8v8H4z');
  if (reduceMotion()) V3.show.still = true;
}
function stopShow() {
  if (!V3.show) return; V3.show = null; if (V3.routeG) V3.routeG.clear();
  for (const k in V3.burners) V3.burners[k].emissiveIntensity = 0;
  $('#cap3d').hidden = true; $('#showBtn').classList.remove('on'); $('#showLbl').textContent = '동선 쇼'; $('#showIco').setAttribute('d', 'M5 3.2v9.6L12.6 8z');
}
function buildCaption() {
  const c = $('#cap3d'); c.hidden = false;
  c.innerHTML = ANA.legs.map((l, i) => `<div class="r" data-i="${i}"><span class="legno" style="background:var(--${l.col})">${i + 1}</span><span class="t">${l.label}</span><span class="v mono" data-v="${i}">${l.len ? '0.0 m' : '–'}</span></div>`).join('')
    + `<div class="r tot" data-i="4"><span class="t">${ANA.crosses.length ? '세척 길이 식재료 길과 엇갈림' : '총 걷는 거리'}</span><span class="v mono">${(ANA.total / 1000).toFixed(1)} m</span></div>`;
}
// timeline (s): leg i draws [S_i, S_i+DRAW]; payoff holds; reverse-stagger exit; seam.
const SHOW_S = [0.5, 3.1, 5.7, 8.3], DRAW = 1.9, EXIT = 12.4;
function tickShow(now) {
  const sh = V3.show; let t = sh.still ? 11.5 : ((now - sh.t0) / 1000) % LOOP;
  if (!V3.userCam && !sh.still) V3.sph.th = sh.th0 + 0.1 * Math.sin(2 * Math.PI * t / LOOP);
  const rows = $$('#cap3d .r');
  sh.legs.forEach((g, i) => {
    let p = ease((t - SHOW_S[i]) / DRAW); const out = EXIT + (3 - i) * 0.07, q = 1 - ease((t - out) / 0.45); p = Math.min(p, q);
    const set = (rb) => { const k = Math.round(p * (rb.ofs.length - 1)); rb.m.geometry.setDrawRange(0, rb.ofs[k]); return k; };
    if (g) {
      const k = set(g.top); set(g.under);
      const pa = easeOut((t - SHOW_S[i]) / 0.45), pb = easeOut((t - SHOW_S[i] - DRAW + 0.15) / 0.45), s = (v) => Math.max(0.001, Math.min(v, q) * (1 + 0.18 * Math.sin(Math.PI * Math.min(v, 1))));
      g.a.scale.setScalar(s(pa)); g.b.scale.setScalar(s(pb));
      const drawing = p > 0 && p < 1 && t < out; g.tip.visible = drawing; if (drawing) { const sp = g.top.samples[Math.min(g.top.samples.length - 1, Math.round(p * (g.top.samples.length - 1)))]; g.tip.position.set(sp.x * MM, 0.09, sp.y * MM); }
      const v = rows[i]?.querySelector('[data-v]'); if (v) v.textContent = (g.l.len * Math.min(1, ease((t - SHOW_S[i]) / DRAW)) / 1000).toFixed(1) + ' m';
    }
    rows[i]?.classList.toggle('in', t >= SHOW_S[i] && t < out + 0.1);
  });
  rows[4]?.classList.toggle('in', t >= SHOW_S[3] + DRAW && t < EXIT + 0.35);
  const fl = V3.burners[sh.cook]; if (fl) fl.emissiveIntensity = 0.85 * Math.min(easeOut((t - SHOW_S[2] - DRAW + 0.2) / 0.6), 1 - ease((t - EXIT) / 0.45));
  if (sh.cross) { const a = easeOut((t - SHOW_S[3] - DRAW) / 0.5), q = 1 - ease((t - EXIT) / 0.4); sh.cross.scale.setScalar(Math.max(0.001, Math.min(a, q))); sh.cross.material.opacity = 0.9; }
}
$('#v3d').addEventListener('click', enter3D);
$('#v2d').addEventListener('click', () => { if (V3.on) exit3D(); });
$('#showBtn').addEventListener('click', () => { if (!V3.r) return; V3.show ? stopShow() : startShow(); });
$('#v3Cut').addEventListener('click', e => { V3.cut = !V3.cut; e.currentTarget.textContent = V3.cut ? '벽 실제 높이' : '벽 낮추기'; build3D(); });
$('#v3Reset').addEventListener('click', () => { reset3D(); if (V3.show) V3.show.th0 = V3.sph.th; });

/* ---------- toolbar ---------- */
$$('.seg [data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#undo').addEventListener('click', undo); $('#redo').addEventListener('click', redo);
$('#zoomIn').addEventListener('click', () => { zoomAt(center(), 1.35); scheduleFull(); });
$('#zoomOut').addEventListener('click', () => { zoomAt(center(), 1 / 1.35); scheduleFull(); });
$('#zoomLbl').addEventListener('click', () => { fit(); renderAll(); });
$('#status').addEventListener('click', e => {
  const b = e.target.closest('[data-issue]'); if (!b) return;
  const arr = b.dataset.issue === 'cols' ? checks.cols : checks.aisles; if (!arr.length) return;
  const is = arr[issueCursor++ % arr.length]; sel = new Set([is.a, is.b].filter(id => byId(id)));
  const box = 'w' in is ? { x: is.x, y: is.y, w: is.w, h: is.h } : normRect({ x: is.x1, y: is.y1 }, { x: is.x2, y: is.y2 });
  focusBox(box); selectionChanged();
});

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- theme changes ---------- */
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { renderAll(); renderLib(); schedule3D(); });
new MutationObserver(() => { renderAll(); renderLib(); schedule3D(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });

/* ---------- boot ---------- */
const hadLocal = loadLocal();
if (!hadLocal) S.items = defaultItems();
pal = readPalette();
renderLib();
openTab(matchMedia('(max-width: 860px)').matches ? 'props' : 'props');
if (matchMedia('(max-width: 860px)').matches) $('#panel').classList.add('collapsed');
updateHistoryBtns();
Store.init();
getDownloads();
if (!hadLocal) setTimeout(() => toast('받은 도면을 따라 장비를 배치했습니다. 끌어서 조정해 보세요'), 600);
</script>
