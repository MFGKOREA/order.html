<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--wrap-end-->
<title>Kitchen Layout Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen drafting desk. Toolbar on top, plan canvas fills the room, a tabbed side panel (bottom sheet on phones). */
:root{
  --bg:#E9EEF0; --panel:#FFFFFF; --panel-2:#F4F7F8; --ink:#1A242C; --muted:#5B6873; --line:#D3DBE0;
  --canvas:#FBFCFC; --grid:#EBF0F2; --grid-major:#D5DEE2;
  --accent:#0E7A69; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC;
  --warn:#C9741C; --danger:#CF3B3B; --ok:#2E8A57;
  --cold:#2F6DB5; --hot:#C9502A; --wash:#13879A; --work:#5F6B77; --misc:#8A6A3E;
  --struct:#2A3137; --hood:#7A54BE; --zone:#9C7A42; --door:#46525C; --sel:#0E7A69; --magnet:#D6307F;
  --under-filter:none;
  --font-ui:"IBM Plex Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1316; --panel:#161C20; --panel-2:#1C2328; --ink:#E3E9EC; --muted:#93A1AA; --line:#2A343A;
    --canvas:#11171A; --grid:#182024; --grid-major:#243036;
    --accent:#3DC3A8; --accent-ink:#04211B; --accent-soft:#163A33;
    --warn:#E89A4A; --danger:#F06A6A; --ok:#58C08A;
    --cold:#6EA7EA; --hot:#F0855A; --wash:#4DC2D2; --work:#9AA7B2; --misc:#CDA772;
    --struct:#C7D0D6; --hood:#B394EA; --zone:#CCAA70; --door:#AEB9C1; --sel:#3DC3A8; --magnet:#F25CA2;
    --under-filter:invert(1) hue-rotate(180deg);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1316; --panel:#161C20; --panel-2:#1C2328; --ink:#E3E9EC; --muted:#93A1AA; --line:#2A343A;
  --canvas:#11171A; --grid:#182024; --grid-major:#243036;
  --accent:#3DC3A8; --accent-ink:#04211B; --accent-soft:#163A33;
  --warn:#E89A4A; --danger:#F06A6A; --ok:#58C08A;
  --cold:#6EA7EA; --hot:#F0855A; --wash:#4DC2D2; --work:#9AA7B2; --misc:#CDA772;
  --struct:#C7D0D6; --hood:#B394EA; --zone:#CCAA70; --door:#AEB9C1; --sel:#3DC3A8; --magnet:#F25CA2;
  --under-filter:invert(1) hue-rotate(180deg);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px}

/* ---------- toolbar ---------- */
.bar{grid-column:1 / -1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.eyebrow{font:500 10.5px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:3px 0 0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:7px;padding:6px 9px;font-size:13px;color:var(--ink);min-height:32px}
.seg button:hover{background:var(--panel-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.35;cursor:default;background:transparent}
.seg svg{width:16px;height:16px;flex:none}
#zoomLbl{min-width:58px;justify-content:center;font-family:var(--font-mono);font-size:12.5px}
.status{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;border:1px solid transparent;background:var(--panel)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb, var(--ok) 35%, transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb, var(--warn) 45%, transparent)}
.pill.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 45%, transparent)}
button.pill{cursor:pointer}

/* ---------- stage ---------- */
.stage{position:relative;min-width:0;min-height:0;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:none}
#cv line,#cv rect,#cv path,#cv circle,#cv ellipse,#cv polyline,#cv polygon{vector-effect:non-scaling-stroke}
#cv text{font-family:var(--font-ui);pointer-events:none}
#under{filter:var(--under-filter)}
.lib svg *{vector-effect:non-scaling-stroke}
#cv .it{cursor:grab}
#cv.panning,#cv.panning .it{cursor:grabbing}
#cv.tool-hand,#cv.tool-hand .it{cursor:grab}
#cv.tool-measure,#cv.tool-measure .it,#cv.tool-calib,#cv.tool-calib .it{cursor:crosshair}
#cv [data-h]{cursor:nwse-resize}
#cv [data-h="n"],#cv [data-h="s"]{cursor:ns-resize}
#cv [data-h="e"],#cv [data-h="w"]{cursor:ew-resize}
#cv [data-h="ne"],#cv [data-h="sw"]{cursor:nesw-resize}

.hud{position:absolute;left:12px;bottom:10px;display:flex;align-items:flex-end;gap:14px;pointer-events:none;font:500 11.5px/1 var(--font-mono);color:var(--muted)}
.scalebar{display:flex;flex-direction:column;gap:4px}
.scalebar b{display:block;height:6px;border:1.5px solid var(--ink);border-top:0;opacity:.75}
.coords{white-space:nowrap}
.qbar{position:absolute;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);z-index:3}
.qbar button{border:0;background:transparent;border-radius:7px;display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:12.5px;min-height:32px}
.qbar button:hover{background:var(--panel-2)}
.qbar button.danger{color:var(--danger)}
.qbar svg{width:15px;height:15px}
.floatcard{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.4);z-index:4;width:min(380px, calc(100% - 24px));display:flex;flex-direction:column;gap:8px}
.floatcard p{margin:0;font-size:13px;color:var(--muted)}
.floatcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-6px);background:var(--ink);color:var(--canvas);padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .18s, transform .18s;pointer-events:none;z-index:5;max-width:calc(100% - 24px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);flex:none}
.tabs button{border:0;background:transparent;padding:11px 4px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{overflow:auto;min-height:0;flex:1;padding:14px 14px 22px}
.pane{display:flex;flex-direction:column;gap:16px}
.pane h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.group{display:flex;flex-direction:column;gap:8px}
.lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lib button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 8px;min-width:0}
.lib button:hover{border-color:var(--accent);background:var(--accent-soft)}
.lib svg{width:42px;height:30px;flex:none}
.lib span{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.lib b{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib small{font:11px var(--font-mono);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:34px;min-width:0}
input[type=number]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.unit{position:relative}
.unit input{padding-right:34px}
.unit::after{content:attr(data-u);position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--font-mono);color:var(--muted);pointer-events:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn svg{width:15px;height:15px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dirs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 2px;font-size:12px;min-height:34px}
.dirs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.empty p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.chip i{width:10px;height:10px;border-radius:3px;display:block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--panel-2);font-size:11.5px}
td.n,th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
tfoot td{font-weight:600;border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.saved{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.issue{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;font-size:13px}
.issue:hover{background:var(--panel-2)}
.issue b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue span{font:12px var(--font-mono);color:var(--muted);white-space:nowrap}
.issue.bad span{color:var(--danger)} .issue.warn span{color:var(--warn)}
.roles{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px}
.roles i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legno{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font:600 11px var(--font-mono);color:#fff;margin-right:6px}
.saved .row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.saved .row div{flex:1;min-width:0;display:flex;flex-direction:column}
.saved .row b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved .row small{font:11px var(--font-mono);color:var(--muted)}
.saved .btn{min-height:30px;padding:4px 9px;font-size:12.5px}
details{border:1px solid var(--line);border-radius:9px;padding:8px 10px}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details[open] summary{margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0}

@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding-block:8px}
  .brand h1{font-size:15px}
  .brand .eyebrow{display:none}
  .seg button .t{display:none}
  .status{margin-left:0}
  .panel{max-height:46vh}
  .tabs button{font-size:12px;padding:10px 2px}
  .panel.collapsed .pbody{display:none}
  .coords{display:none}
}
@media (max-width: 600px){ .brand{display:none} .tools{gap:6px} .seg button{padding:6px 8px} }
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><span class="eyebrow">Kitchen Layout</span><h1>주방 배치 플래너</h1></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="도구">
        <button type="button" data-mode="select" class="on" title="선택 · 이동 (V)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 2l9.5 5.2-4.2 1.1L6.4 13z"/></svg><span class="t">선택</span></button>
        <button type="button" data-mode="hand" title="화면 이동 (H · 스페이스 누른 채 드래그)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 8V3.5a1 1 0 012 0V7m0-4.5a1 1 0 012 0V7m0-3.5a1 1 0 012 0V8m0-2.5a1 1 0 012 0V10c0 2.5-1.8 4.5-4.3 4.5H8.2C6.6 14.5 5.4 13.6 4.6 12L3 9a1 1 0 011.7-1z"/></svg><span class="t">이동</span></button>
        <button type="button" data-mode="measure" title="거리 재기 (M)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="5" width="13" height="6" rx="1"/><path d="M4.5 5v2.5M7 5v1.8M9.5 5v2.5M12 5v1.8"/></svg><span class="t">재기</span></button>
      </div>
      <div class="seg" role="group" aria-label="실행 취소">
        <button type="button" id="undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5L2.5 6.5l3 3"/><path d="M2.5 6.5H10a3.5 3.5 0 010 7H7"/></svg></button>
        <button type="button" id="redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5l3 3-3 3"/><path d="M13.5 6.5H6a3.5 3.5 0 000 7h3"/></svg></button>
      </div>
      <div class="seg" role="group" aria-label="확대">
        <button type="button" id="zoomOut" title="축소" aria-label="축소"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 8h9"/></svg></button>
        <button type="button" id="zoomLbl" title="전체 보기 (F)">100%</button>
        <button type="button" id="zoomIn" title="확대" aria-label="확대"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
      </div>
      <div class="seg" role="group" aria-label="밑그림">
        <button type="button" id="underBtn" title="원본 도면 밑그림 표시"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M1.5 9.5l3.5-3 3 2.5 2.5-2 4 3.5"/></svg><span class="t">밑그림</span></button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="주방 평면도" role="img">
      <g id="lUnder"><image id="under" preserveAspectRatio="none" style="pointer-events:none"/></g>
      <g id="lStatic"></g>
      <g id="lZone"></g>
      <g id="lItems"></g>
      <g id="lOver"></g>
      <g id="lOverlay"></g>
    </svg>
    <div class="hud"><div class="scalebar"><span id="sbLbl">1 m</span><b id="sbBar" style="width:60px"></b></div><span class="coords" id="coords"></span></div>
    <div class="qbar" id="qbar" hidden>
      <button type="button" data-q="rotate" title="90° 회전 (R)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 11-1.5-3.6"/><path d="M13 2.5v3h-3"/></svg>회전</button>
      <button type="button" data-q="dup" title="복제 (Ctrl+D)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8.5" height="8.5" rx="1.2"/><path d="M2.5 10.5v-7a1 1 0 011-1h7"/></svg>복제</button>
      <button type="button" data-q="props" title="속성 열기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>속성</button>
      <button type="button" data-q="del" class="danger" title="삭제 (Delete)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9"/></svg>삭제</button>
    </div>
    <div class="floatcard" id="calibBox" hidden>
      <b id="calibTitle">축척 맞추기</b>
      <p id="calibMsg">밑그림에서 길이를 아는 치수선의 양 끝을 이어서 드래그하세요. (예: 1,500 치수선)</p>
      <div class="row" id="calibRow" hidden>
        <label class="field unit" data-u="mm" style="flex:1"><span>실제 길이</span><input type="number" id="calibLen" inputmode="numeric" value="1500"></label>
        <label class="check" style="margin-top:18px"><input type="checkbox" id="calibBoth">가로·세로 같이</label>
      </div>
      <div class="row"><button type="button" class="btn primary" id="calibApply" hidden>적용</button><button type="button" class="btn" id="calibCancel">취소</button></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <aside class="panel" id="panel">
    <nav class="tabs" role="tablist" aria-label="패널">
      <button type="button" role="tab" data-tab="add" aria-selected="false">장비 추가</button>
      <button type="button" role="tab" data-tab="props" aria-selected="true">속성</button>
      <button type="button" role="tab" data-tab="list" aria-selected="false">장비 목록</button>
      <button type="button" role="tab" data-tab="analysis" aria-selected="false">분석</button>
      <button type="button" role="tab" data-tab="setup" aria-selected="false">설정·저장</button>
    </nav>
    <div class="pbody">
      <section class="pane" data-pane="add" hidden>
        <p class="hint">누르면 지금 보이는 화면 가운데에 놓입니다. 놓은 뒤 끌어서 옮기고, 속성에서 크기를 바꾸세요.</p>
        <div id="libWrap" class="pane"></div>
        <div class="group">
          <h2>직접 입력</h2>
          <div class="grid2">
            <label class="field" style="grid-column:1 / -1"><span>이름</span><input type="text" id="cName" value="특수 장비"></label>
            <label class="field" style="grid-column:1 / -1"><span>모양</span><select id="cType"></select></label>
            <label class="field unit" data-u="mm"><span>가로(폭)</span><input type="number" id="cL" value="900" inputmode="numeric"></label>
            <label class="field unit" data-u="mm"><span>깊이</span><input type="number" id="cD" value="700" inputmode="numeric"></label>
          </div>
          <button type="button" class="btn primary" id="cAdd">배치에 추가</button>
        </div>
      </section>
      <section class="pane" data-pane="props" id="propsPane"></section>
      <section class="pane" data-pane="list" id="listPane" hidden></section>
      <section class="pane" data-pane="analysis" id="anaPane" hidden></section>
      <section class="pane" data-pane="setup" id="setupPane" hidden>
        <div class="group">
          <h2>주방 크기 (내부 치수)</h2>
          <div class="grid2">
            <label class="field unit" data-u="mm"><span>가로</span><input type="number" id="roomW" data-cfg="roomW" inputmode="numeric"></label>
            <label class="field unit" data-u="mm"><span>세로</span><input type="number" id="roomH" data-cfg="roomH" inputmode="numeric"></label>
          </div>
        </div>
        <div class="group">
          <h2>배치 도움</h2>
          <label class="field"><span>격자 맞춤</span>
            <select id="cfgGrid" data-cfg="grid"><option value="0">끄기</option><option value="10">10 mm</option><option value="50">50 mm</option><option value="100">100 mm</option><option value="250">250 mm</option></select></label>
          <label class="check"><input type="checkbox" id="cfgMagnet" data-cfg="magnet">다른 장비 모서리에 붙기</label>
          <label class="check"><input type="checkbox" id="cfgChecks" data-cfg="checks">겹침 · 좁은 통로 표시</label>
          <label class="field unit" data-u="mm"><span>최소 통로 폭 (이보다 좁으면 주황색 경고)</span><input type="number" id="cfgAisle" data-cfg="aisleMin" inputmode="numeric"></label>
          <label class="check"><input type="checkbox" id="cfgLabels" data-cfg="labels">장비 이름 표시</label>
          <label class="check"><input type="checkbox" id="cfgSizes" data-cfg="sizes">장비 규격(가로×깊이) 표시</label>
        </div>
        <div class="group">
          <h2>원본 도면 밑그림</h2>
          <label class="check"><input type="checkbox" id="uShow" data-u="show">밑그림 보이기</label>
          <label class="field"><span>진하기 <b class="mono" id="uOpLbl"></b></span><input type="range" id="uOp" data-u="opacity" min="0.05" max="1" step="0.05"></label>
          <div class="btnrow">
            <button type="button" class="btn" id="uCalib">두 점으로 축척 맞추기</button>
            <label class="btn" for="uFile">다른 도면 이미지 넣기</label>
            <input type="file" id="uFile" accept="image/*" hidden>
          </div>
          <details>
            <summary>밑그림 위치 · 크기 직접 입력</summary>
            <div class="grid2">
              <label class="field unit" data-u="mm"><span>X</span><input type="number" data-u="x" id="uX"></label>
              <label class="field unit" data-u="mm"><span>Y</span><input type="number" data-u="y" id="uY"></label>
              <label class="field unit" data-u="mm"><span>가로</span><input type="number" data-u="w" id="uW"></label>
              <label class="field unit" data-u="mm"><span>세로</span><input type="number" data-u="h" id="uH"></label>
            </div>
            <div class="btnrow" style="margin-top:8px"><button type="button" class="btn" id="uReset">받은 도면으로 되돌리기</button></div>
          </details>
        </div>
        <div class="group">
          <h2>배치안 저장</h2>
          <p class="hint" id="storeHint"></p>
          <div class="row" style="display:flex;gap:6px"><input type="text" id="saveName" placeholder="예: A안 – 세척 라인 이동" style="flex:1"><button type="button" class="btn primary" id="saveBtn">저장</button></div>
          <div class="saved" id="savedList"></div>
        </div>
        <div class="group">
          <h2>파일</h2>
          <div class="btnrow">
            <button type="button" class="btn" id="expPng">도면 이미지 (PNG)</button>
            <button type="button" class="btn" id="expCsv">장비 목록 (CSV)</button>
            <button type="button" class="btn" id="expJson">배치 파일 (JSON)</button>
            <label class="btn" for="impJson">배치 파일 불러오기</label>
            <input type="file" id="impJson" accept=".json,application/json" hidden>
          </div>
        </div>
        <div class="group">
          <h2>처음 상태로</h2>
          <p class="hint">받은 도면을 따라 그린 기본 배치로 돌아갑니다. 실행 취소로 되돌릴 수 있습니다.</p>
          <button type="button" class="btn danger" id="resetBtn">기본 배치로 되돌리기</button>
        </div>
      </section>
    </div>
  </aside>
</div>

/* ---------- geometry checks ---------- */
const solid = it => { const l = layerOf(it); return l === 'floor' || l === 'struct'; };
function computeChecks() {
  const cols = [], aisles = [];

  const W = S.room.w, H = S.room.h;
  const kitchen = arr.filter(i => catOf(i) !== 'misc');
  for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
    const a = arr[i], b = arr[j]; if (layerOf(a) === 'struct' && layerOf(b) === 'struct') continue;
    const ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ix > 2 && iy > 2) cols.push({ a: a.id, b: b.id, x: Math.max(a.x, b.x), y: Math.max(a.y, b.y), w: ix, h: iy });
  }
  const min = S.cfg.aisleMin, low = 400;
  const walls = [{ id: '_l', x: -100, y: 0, w: 100, h: H }, { id: '_r', x: W, y: 0, w: 100, h: H }, { id: '_t', x: 0, y: -100, w: W, h: 100 }, { id: '_b', x: 0, y: H, w: W, h: 100 }];
  const all = kitchen.concat(walls);
  const blocked = (rx, ry, rw, rh, a, b) => all.some(c => c !== a && c !== b && c.x < rx + rw - 1 && c.x + c.w > rx + 1 && c.y < ry + rh - 1 && c.y + c.h > ry + 1);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j];
    if (a.id[0] === '_' && b.id[0] === '_') continue;
    const oy0 = Math.max(a.y, b.y), oy1 = Math.min(a.y + a.h, b.y + b.h);
    if (oy1 - oy0 > 150) {
      const [l, r] = a.x < b.x ? [a, b] : [b, a]; const g = r.x - (l.x + l.w);
      if (g >= low && g < min && !blocked(l.x + l.w, oy0, g, oy1 - oy0, a, b)) aisles.push({ a: a.id, b: b.id, x1: l.x + l.w, x2: r.x, y1: (oy0 + oy1) / 2, y2: (oy0 + oy1) / 2, g });
    }
    const ox0 = Math.max(a.x, b.x), ox1 = Math.min(a.x + a.w, b.x + b.w);
    if (ox1 - ox0 > 150) {

      if (g >= low && g < min && !blocked(ox0, t.y + t.h, ox1 - ox0, g, a, b)) aisles.push({ a: a.id, b: b.id, x1: (ox0 + ox1) / 2, x2: (ox0 + ox1) / 2, y1: t.y + t.h, y2: d.y, g });

function bbox(list) {

function clearances(b) {

  const W = S.room.w, H = S.room.h, res = [];
  const ovY = i => i.y < b.y + b.h - 1 && i.y + i.h > b.y + 1, ovX = i => i.x < b.x + b.w - 1 && i.x + i.w > b.x + 1;
  let L = { v: 0, i: null }, R = { v: W, i: null }, T = { v: 0, i: null }, B = { v: H, i: null };
  for (const i of others) {
    if (ovY(i)) { if (i.x + i.w <= b.x + 1 && i.x + i.w > L.v) L = { v: i.x + i.w, i }; if (i.x >= b.x + b.w - 1 && i.x < R.v) R = { v: i.x, i }; }

  if (b.y - T.v > 1) res.push({ x1: midX(T), y1: T.v, x2: midX(T), y2: b.y, g: b.y - T.v });

const scale = () => (svg.clientWidth || 1) / vb.w;

}

  const len = steps.find(v => v >= target * 0.7) || 5000;

function renderUnder() {

/* ---------- view ---------- */

function groups() {

    const lay = layerOf(it); if (lay === 'struct' || lay === 'zone' || lay === 'door') continue;
    const [Lw, D] = spec(it); const key = [it.type, it.name, Lw, D].join('|');
    if (!map.has(key)) map.set(key, { type: it.type, name: it.name, L: Lw, D, cat: catOf(it), ids: [], price: 0, priced: 0 });
    const g = map.get(key); g.ids.push(it.id); if (it.price) { g.price += it.price; g.priced++; }

  return [...map.values()].sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) || a.name.localeCompare(b.name, 'ko') || b.L - a.L);
}

$('#uCalib').addEventListener('click', () => {

  setMode('calib'); $('#calibBox').hidden = false; $('#calibRow').hidden = true; $('#calibApply').hidden = true;
  $('#calibMsg').textContent = '밑그림에서 길이를 아는 치수선의 양 끝을 이어서 드래그하세요. (예: 섬 작업대 위 1,500 치수선)';
  if (matchMedia('(max-width: 860px)').matches) $('#panel').classList.add('collapsed');

function calibReady() {
  if (!measure) return; const d = Math.hypot(measure.b.x - measure.a.x, measure.b.y - measure.a.y); if (d < 50) return;
  const horiz = Math.abs(measure.b.x - measure.a.x) >= Math.abs(measure.b.y - measure.a.y);
  $('#calibMsg').textContent = `지금 화면상 ${fmt(d)} mm (${horiz ? '가로' : '세로'} 방향). 실제 길이를 넣고 적용하세요. 다시 그어도 됩니다.`;
  $('#calibRow').hidden = false; $('#calibApply').hidden = false; $('#calibLen').focus();
}
$('#calibApply').addEventListener('click', () => {
  if (!measure) return; const real = +$('#calibLen').value; if (!(real > 0)) { toast('실제 길이를 mm로 넣어 주세요'); return; }
  const a = measure.a, b = measure.b, dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y), horiz = dx >= dy;
  const k = real / (horiz ? dx : dy); const both = $('#calibBoth').checked; const u = S.under;
  if (horiz || both) { u.x = a.x - (a.x - u.x) * k; u.w *= k; }
  if (!horiz || both) { u.y = a.y - (a.y - u.y) * k; u.h *= k; }
  persist(); renderUnder(); renderSetup(); setMode('select'); toast(`밑그림 ${horiz && !both ? '가로' : !horiz && !both ? '세로' : ''} 축척을 맞췄습니다 (×${k.toFixed(3)})`);
});

/* ---------- saved layouts (shared store when available, else this browser) ---------- */
const Store = {
  mode: 'local', db: null, list: [], unsub: null,
  async init() {
    renderSaved();
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const db = await window.claude.use('db');
        if (db) {
          this.db = db; this.mode = 'db';
          const t = setTimeout(() => { $('#storeHint').textContent = '공유 저장소에 아직 연결되지 않았습니다. 잠시 후 다시 확인하세요.'; }, 10000);
          this.unsub = db.collection('layouts').onSnapshot(s => { clearTimeout(t); this.list = s.docs.map(d => ({ id: d.id, ...d.data() })); renderSaved(); }, () => { clearTimeout(t); this.mode = 'local'; this.list = this.readLocal(); renderSaved(); });
        }
      }
    } catch { this.mode = 'local'; }
    if (this.mode === 'local') { this.list = this.readLocal(); renderSaved(); }
  },
  readLocal() { try { return JSON.parse(lsGet(LS_SAVES) || '[]'); } catch { return []; } },
  async save(name) {
    const doc = { name, savedAt: Date.now(), count: S.items.length, data: JSON.stringify({ room: S.room, items: S.items, cfg: S.cfg }) };
    if (this.mode === 'db') { const id = 'l' + Date.now().toString(36) + uid(); await this.db.collection('layouts').doc(id).set(doc); return; }
    const l = this.readLocal(); l.push({ id: 'l' + Date.now().toString(36), ...doc }); if (!lsSet(LS_SAVES, JSON.stringify(l))) throw new Error('local');
    this.list = l; renderSaved();
  },
  async remove(id) {
    if (this.mode === 'db') { await this.db.collection('layouts').doc(id).delete(); return; }
    const l = this.readLocal().filter(x => x.id !== id); lsSet(LS_SAVES, JSON.stringify(l)); this.list = l; renderSaved();
  },
};

$('#savedList').addEventListener('click', async e => {
  const ld = e.target.closest('[data-load]'), dl = e.target.closest('[data-del]');
  if (ld) { const x = Store.list.find(v => v.id === ld.dataset.load); if (!x) return; try { const o = JSON.parse(x.data); checkpoint(); S.room = o.room; S.items = o.items; if (o.cfg) S.cfg = { ...DEFAULT_CFG, ...o.cfg }; sel.clear(); fit(); changed(); toast(`'${x.name}' 불러왔습니다 · Ctrl+Z로 되돌리기`); } catch { toast('이 배치안을 읽지 못했습니다'); } }
  if (dl) { const id = dl.dataset.del; if (armedDel !== id) { armedDel = id; renderSaved(); setTimeout(() => { if (armedDel === id) { armedDel = null; renderSaved(); } }, 3500); return; } armedDel = null; try { await Store.remove(id); toast('삭제했습니다'); } catch { toast('삭제하지 못했습니다'); } renderSaved(); }
});
let resetArmed = false;
$('#resetBtn').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!resetArmed) { resetArmed = true; b.classList.add('armed'); b.textContent = '한 번 더 누르면 되돌립니다'; setTimeout(() => { resetArmed = false; b.classList.remove('armed'); b.textContent = '기본 배치로 되돌리기'; }, 3500); return; }
  resetArmed = false; b.classList.remove('armed'); b.textContent = '기본 배치로 되돌리기';
  checkpoint(); S.room = { ...DEFAULT_ROOM }; S.items = defaultItems(); sel.clear(); fit(); changed(); toast('기본 배치로 되돌렸습니다');
});

/* ---------- files ---------- */
let dlCap = null;
async function getDownloads() { try { if (dlCap === null && window.claude && typeof window.claude.use === 'function') dlCap = (await window.claude.use('downloads')) || false; } catch { dlCap = false; } return dlCap || null; }
async function offerFile(filename, data, mime) {
  const dl = await getDownloads();
  if (dl) { try { await dl.save({ filename, data }); toast('저장했습니다'); return; } catch (err) { if (err && err.code === 'declined') { toast('저장을 취소했습니다'); return; } if (err && err.code === 'rate_limited') { toast('잠시 후 다시 눌러 주세요'); return; } } }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };
function exportCSV() {
  const rows = [['구분', '장비', '가로(mm)', '깊이(mm)', '수량', '금액(원)', '메모']];
  for (const g of groups()) { const notes = [...new Set(g.ids.map(id => byId(id).note).filter(Boolean))].join(' / '); rows.push([CAT_NAME[g.cat], g.name, g.L, g.D, g.ids.length, g.priced ? g.price : '', notes]); }
  const csv = '﻿' + rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\r\n');
  offerFile(`주방장비목록_${stamp()}.csv`, csv, 'text/csv');
}
$('#expCsv').addEventListener('click', exportCSV);
$('#expJson').addEventListener('click', () => offerFile(`주방배치_${stamp()}.json`, JSON.stringify({ app: 'kitchen-layout', v: 1, room: S.room, items: S.items, cfg: S.cfg }, null, 1), 'application/json'));
$('#impJson').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const o = JSON.parse(rd.result); if (!Array.isArray(o.items)) throw 0; checkpoint(); S.room = o.room || S.room; S.items = o.items.map(i => ({ ...i, id: i.id || uid() })); if (o.cfg) S.cfg = { ...DEFAULT_CFG, ...o.cfg }; sel.clear(); fit(); changed(); toast('배치 파일을 불러왔습니다'); } catch { toast('배치 파일 형식이 아닙니다'); } };
  rd.readAsText(f); e.target.value = '';
});
function exportSVGString(withUnder) {
  const P = { ...LIGHT }; const m = 900, W = S.room.w, H = S.room.h, tb = 900;
  const x0 = -m - 200, y0 = -m, w = W + 2 * m + 200, h = H + 2 * m + tb; const px = 3600, s = px / w;
  const ctx = { s }; const ly = layersSVG(P, ctx);
  const eq = S.items.filter(i => layerOf(i) === 'floor').length;
  const fs = 20 / s;
  const sbY = H + m + 320, sbX = 0;
  let sb = ''; for (let k = 0; k < 3; k++) sb += `<rect x="${sbX + k * 1000}" y="${sbY}" width="1000" height="${n1(10 / s)}" fill="${k % 2 ? P.canvas : P.ink}" stroke="${P.ink}" stroke-width="1"/><text x="${sbX + k * 1000}" y="${n1(sbY + 30 / s)}" font-size="${n1(13 / s)}" fill="${P.muted}" font-family="${MONO}">${k}</text>`;
  sb += `<text x="${sbX + 3000}" y="${n1(sbY + 30 / s)}" font-size="${n1(13 / s)}" fill="${P.muted}" font-family="${MONO}">3 m</text>`;
  const title = `<text x="${W}" y="${n1(H + m + 360)}" text-anchor="end" font-size="${n1(fs * 1.3)}" font-weight="700" fill="${P.ink}">주방 배치도</text>
    <text x="${W}" y="${n1(H + m + 360 + fs * 1.6)}" text-anchor="end" font-size="${n1(fs * 0.8)}" fill="${P.muted}" font-family="${MONO}">${fmt(W)} × ${fmt(H)} mm · 바닥 장비 ${eq}개 · ${new Date().toLocaleDateString('ko-KR')}</text>`;
  const under = withUnder && S.under.show ? `<image href="${underData}" x="${S.under.x}" y="${S.under.y}" width="${S.under.w}" height="${S.under.h}" opacity="${S.under.opacity}" preserveAspectRatio="none"/>` : '';
  return { str: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${w} ${h}" width="${px}" height="${Math.round(h * s)}" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><style>line,rect,path,circle,ellipse{vector-effect:non-scaling-stroke}</style><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#FFFFFF"/>${under}${staticSVG(P, ctx)}${ly.zone}${ly.items}${ly.over}${sb}${title}</svg>`, w: px, h: Math.round(h * s) };
}
$('#expPng').addEventListener('click', async () => {
  toast('이미지를 만드는 중…');
  const { str, w, h } = exportSVGString(false);
  const img = new Image();
  try { await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str); }); } catch { toast('이미지를 만들지 못했습니다'); return; }
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  cv.toBlob(b => { if (b) offerFile(`주방배치도_${stamp()}.png`, b, 'image/png'); else toast('이미지를 만들지 못했습니다'); }, 'image/png');
});

/* ---------- toolbar ---------- */
$$('.seg [data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#undo').addEventListener('click', undo); $('#redo').addEventListener('click', redo);
$('#zoomIn').addEventListener('click', () => { zoomAt(center(), 1.35); scheduleFull(); });
$('#zoomOut').addEventListener('click', () => { zoomAt(center(), 1 / 1.35); scheduleFull(); });
$('#zoomLbl').addEventListener('click', () => { fit(); renderAll(); });
$('#status').addEventListener('click', e => {
  const b = e.target.closest('[data-issue]'); if (!b) return;
  const arr = b.dataset.issue === 'cols' ? checks.cols : checks.aisles; if (!arr.length) return;
  const is = arr[issueCursor++ % arr.length]; sel = new Set([is.a, is.b].filter(id => byId(id)));
  const box = 'w' in is ? { x: is.x, y: is.y, w: is.w, h: is.h } : normRect({ x: is.x1, y: is.y1 }, { x: is.x2, y: is.y2 });
  focusBox(box); selectionChanged();
});

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- theme changes ---------- */
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { renderAll(); renderLib(); });
new MutationObserver(() => { renderAll(); renderLib(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });

/* ---------- boot ---------- */
const hadLocal = loadLocal();
if (!hadLocal) S.items = defaultItems();
pal = readPalette();
renderLib();
openTab(matchMedia('(max-width: 860px)').matches ? 'props' : 'props');
if (matchMedia('(max-width: 860px)').matches) $('#panel').classList.add('collapsed');
updateHistoryBtns();
Store.init();
getDownloads();
if (!hadLocal) setTimeout(() => toast('받은 도면을 따라 장비를 배치했습니다. 끌어서 조정해 보세요'), 600);
</script>
</body>
</html>
