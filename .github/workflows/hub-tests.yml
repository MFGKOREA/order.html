name: hub tests
on:
  push:
    paths: ["tools/**", "tests/**", "prompts/**", "requirements.txt", ".github/workflows/hub-tests.yml"]
  pull_request:
    paths: ["tools/**", "tests/**", "prompts/**", "requirements.txt", ".github/workflows/hub-tests.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
