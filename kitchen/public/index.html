<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="허브">
<title>피클 허브</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
<p class="mark">피클 허브</p>
<h1 id="title">확인할 일</h1>
<form id="login" class="ticket">
<label class="mark" for="password">비밀번호</label>
<input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go">
<button type="submit">들어가기</button>
<p id="login-note" class="note" hidden></p>
</form>
<div id="kitchen" hidden></div>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
