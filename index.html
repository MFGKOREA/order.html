<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숏핑 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: 한 줄 목록. 상품 하나 = 패키지 카드 하나(왼쪽 9:16 영상, 오른쪽 복사할 문구). 휴대폰에선 위아래로 쌓임. 발주 앱 크림 테마. */
:root {
  --page: #ebeae5;
  --bg: #f5f4f0;
  --surface: #ffffff;
  --fill: rgba(120, 116, 104, .11);
  --fill-2: #f4f3ef;
  --fg: #1b1e1c;
  --muted: #878a85;
  --line: rgba(27, 30, 28, .08);
  --accent: #24503f;
  --accent-ink: #ffffff;
  --accent-soft: #e7eee9;
  --chick: #f6efdc; --chick-line: #e3d3a4; --chick-ink: #7a5c17;
  --rose: #f5e6e0; --rose-line: #e2b7a9; --rose-ink: #a04632;
  --shadow: 0 1px 2px rgba(27, 30, 28, .04), 0 4px 14px rgba(27, 30, 28, .05);
  --font: "Microsoft GothicNeo", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #090a09; --bg: #0f1110; --surface: #191c1a; --fill: rgba(160, 156, 144, .14); --fill-2: #222523;
    --fg: #eceeea; --muted: #8f938e; --line: rgba(255, 255, 255, .08);
    --accent: #8cc7a9; --accent-ink: #0d1813; --accent-soft: #1d2a24;
    --chick: #2f2a1c; --chick-line: #554a2c; --chick-ink: #e6cf8c;
    --rose: #32211d; --rose-line: #5e3a31; --rose-ink: #eba593;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #090a09; --bg: #0f1110; --surface: #191c1a; --fill: rgba(160, 156, 144, .14); --fill-2: #222523;
  --fg: #eceeea; --muted: #8f938e; --line: rgba(255, 255, 255, .08);
  --accent: #8cc7a9; --accent-ink: #0d1813; --accent-soft: #1d2a24;
  --chick: #2f2a1c; --chick-line: #554a2c; --chick-ink: #e6cf8c;
  --rose: #32211d; --rose-line: #5e3a31; --rose-ink: #eba593;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.45; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }

/* header */
.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 4px 2px 0; }
.hdr h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.15; color: var(--rose-ink); }
.hdr p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.datepill { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; background: var(--surface); border-radius: 12px; padding: 6px 13px; box-shadow: var(--shadow); white-space: nowrap; }
.datepill small { font-size: 17px; font-weight: 800; margin-left: 4px; }
.banner { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
.banner ol { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.banner li { counter-increment: s; }
.banner li::before { content: counter(s); display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; margin-right: 5px; vertical-align: 1px; }

/* package */
.sect { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 4px -6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.pkg { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.pkg-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto 12px; gap: 4px 10px; align-items: center; border: 0; background: none; text-align: left; padding: 14px 16px; }
.pkg-head .nm { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; min-width: 0; overflow-wrap: anywhere; }
.pkg-head .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.pkg-head .chev { color: var(--muted); transition: transform .2s; }
.pkg-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .pkg-head .chev { transition: none; } }
.chip { flex: none; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.chip.ex { background: var(--chick); color: var(--chick-ink); }
.chip.todo { background: var(--rose); color: var(--rose-ink); }
.chip.done { background: var(--accent-soft); color: var(--accent); }
.pkg-body { border-top: 1px solid var(--line); padding: 16px; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; background: var(--bg); }
@media (max-width: 720px) { .pkg-body { grid-template-columns: minmax(0, 1fr); } }

/* player */
.player { display: grid; gap: 10px; width: 100%; max-width: 270px; margin: 0 auto; }
.player canvas { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; display: block; border-radius: 22px; background: #efeee9; box-shadow: var(--shadow); }
.ctrls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; background: var(--surface); color: var(--fg); box-shadow: var(--shadow); white-space: nowrap; position: relative; }
.btn.primary { background: var(--accent); color: var(--accent-ink); grid-column: 1 / -1; }
.btn.soft { background: var(--fill); box-shadow: none; color: var(--accent); }
.btn input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: default; }
.pnote { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
.photos { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.photos span { position: relative; width: 38px; aspect-ratio: 9 / 16; border-radius: 6px; overflow: hidden; background: var(--fill); }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos button { position: absolute; inset: auto 0 0; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 1px 0; }
video.out { width: 100%; border-radius: 14px; background: #000; }

/* copy groups */
.copies { display: grid; gap: 8px; min-width: 0; }
.label { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 4px 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.group { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.cell { padding: 11px 14px; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--line); }
.cell .txt { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 14px; }
.cell .txt.long { max-height: 9.5em; overflow: auto; font-size: 13.5px; color: var(--fg); }
.cell .k { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.copy { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; background: var(--fill); color: var(--accent); white-space: nowrap; }
.copy.done { background: var(--accent); color: var(--accent-ink); }
.scene { grid-template-columns: 44px minmax(0, 1fr); }
.scene .t { font-size: 11.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.scene b { display: block; font-size: 14px; }
.scene span { display: block; font-size: 13px; color: var(--muted); }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 11px; padding: 2px; }
.seg button { border: 0; background: none; padding: 7px 0; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.tipcard { display: grid; gap: 4px; background: var(--chick); color: var(--chick-ink); border-radius: 16px; padding: 13px 16px; font-size: 13.5px; }
.tipcard b { font-size: 14px; font-weight: 800; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div>
      <h1>숏핑 스튜디오</h1>
      <p>채팅에 쿠팡 링크를 보내면 쇼츠 패키지가 여기에 하나씩 추가돼요.</p>
    </div>
    <span class="datepill" id="today"></span>
  </header>
  <div class="banner">
    <ol>
      <li>사진 넣기</li>
      <li>영상 저장</li>
      <li>문구 복사</li>
      <li>업로드할 때 ‘유료 프로모션 포함’ 체크</li>
    </ol>
  </div>
  <div id="list"></div>
  <div class="tipcard">
    <b>새 상품 추가</b>
    <span>채팅에 쿠팡 링크를 보내 주세요. 쿠팡 앱의 ‘공유 → 복사’ 문구를 그대로 붙여넣으면 상품명까지 함께 들어가서 더 정확해요. 상품 사진 캡처를 같이 보내면 영상에 바로 넣어 드려요.</span>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 패키지 데이터: 채팅에서 링크를 받으면 Claude가 여기에 추가합니다 -->
<script type="application/json" id="packages">
[
  {
    "id": "ex-001",
    "example": true,
    "date": "2026-10-30",
    "name": "접이식 실리콘 설거지통 10L",
    "short": "접이식 설거지통",
    "link": "https://link.coupang.com/a/example",
    "price": 12900,
    "orig": 18900,
    "scenes": [
      { "type": "hook", "cap": "좁은 싱크대 해결템", "nar": "좁은 싱크대, 설거지통 둘 자리 없으시죠?" },
      { "type": "reveal", "cap": "접이식 설거지통", "nar": "그래서 가져온 게 바로 이 접이식 설거지통이에요" },
      { "type": "feature", "cap": "접으면 두께 4cm", "nar": "안 쓸 땐 접어서 두께 4센치로 보관하고" },
      { "type": "feature", "cap": "배수 마개로 물 빼기", "nar": "바닥 배수 마개로 물 빼기도 간편해요" },
      { "type": "feature", "cap": "가볍고 안 깨지는 실리콘", "nar": "실리콘이라 가볍고 잘 안 깨져요" },
      { "type": "price", "cap": "12,900원", "nar": "정가는 만 팔천구백 원인데, 지금은 만 이천구백 원이에요" },
      { "type": "cta", "cap": "아래 상품 태그 확인!", "nar": "구매 정보는 화면 아래 상품 태그에 넣어둘게요" }
    ],
    "titles": [
      "[광고] 좁은 싱크대 해결템, 접이식 설거지통 #shorts",
      "[광고] 자취생 필수템, 접으면 4cm 설거지통 #shorts",
      "[광고] 12,900원으로 싱크대가 넓어졌어요 #shorts"
    ],
    "body": "▶ 접이식 실리콘 설거지통 10L\n· 안 쓸 땐 접어서 두께 4cm로 보관\n· 바닥 배수 마개로 물 빼기 간편\n· 실리콘 소재라 가볍고 잘 안 깨져요",
    "tags": ["쿠팡", "쿠팡추천템", "주방템", "자취생필수템", "설거지통", "살림꿀템", "shorts"]
  }
]
</script>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const W = 1080, H = 1920;
const AD_SHORT = '쿠팡 파트너스 활동으로 수수료를 받을 수 있어요';
const AD_FULL = '이 영상은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.';
const STATUS_KEY = 'shopping-studio:status:v2';
// 영상 팔레트 (크림 테마)
const V = { cream: '#f6efdc', ivory: '#f5f4f0', page: '#ebeae5', green: '#24503f', ink: '#1b1e1c', rose: '#a04632', white: '#ffffff' };
const FONT = '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

const PKGS = JSON.parse($('#packages').textContent).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (a.example ? 1 : -1));
const store = {
  get() { try { return JSON.parse(localStorage.getItem(STATUS_KEY)) || {}; } catch { return {}; } },
  set(v) { try { localStorage.setItem(STATUS_KEY, JSON.stringify(v)); } catch { /* 저장 불가 */ } }
};
const won = (n) => n.toLocaleString('ko-KR') + '원';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ymd = (d) => `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
{
  const d = new Date();
  $('#today').innerHTML = `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, '0')}<small>${'일월화수목금토'[d.getDay()]}</small>`;
}

/* ---------- 패키지 데이터 가공 ---------- */
function prep(p) {
  let t = 0;
  p.scenes.forEach((s) => {
    const n = s.nar.replace(/\s/g, '').length;
    s.dur = Math.min(6, Math.max(1.5, n / 7.2 + 0.3));
    s.start = t; t += s.dur;
  });
  let fi = 0;
  p.scenes.forEach((s) => { if (s.type === 'feature') s.label = `포인트 ${++fi}`; });
  p.total = t;
  p.disc = p.orig > p.price && p.price ? Math.round((1 - p.price / p.orig) * 100) : 0;
  const tags = (p.tags || []).map((x) => '#' + x.replace(/[^0-9A-Za-z가-힣]/g, '')).join(' ');
  p.tagText = tags;
  p.desc = [`[광고] ${AD_FULL}`, '', p.body,
    p.price ? `· 가격: ${won(p.price)} (${p.date.replace(/-/g, '.')} 기준, 바뀔 수 있어요)` : '',
    `· 구매 링크: ${p.link}`, '', tags].filter((x, i, a) => x !== '' || a[i - 1] !== '').join('\n');
  p.comment = `[광고] ${AD_SHORT}\n${p.name}\n${p.link}`;
  return p;
}
PKGS.forEach(prep);

/* ---------- 목록 ---------- */
function statusOf(p) { return p.example ? 'ex' : (store.get()[p.id] || 'todo'); }
const STATUS_LABEL = { ex: '예시', todo: '업로드 전', done: '업로드 완료' };
function render() {
  const list = $('#list');
  list.innerHTML = PKGS.map((p, i) => {
    const st = statusOf(p);
    return `<article class="pkg" data-id="${p.id}" style="margin-bottom:12px">
      <button type="button" class="pkg-head" aria-expanded="${i === 0}">
        <span class="nm">${esc(p.name)}</span>
        <span class="chip ${st}" data-chip>${STATUS_LABEL[st]}</span>
        <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5"/></svg>
        <span class="meta">${p.date.replace(/-/g, '.')} · ${p.price ? won(p.price) : '가격 미정'}${p.disc ? ` · ${p.disc}% 할인` : ''} · ${p.total.toFixed(0)}초</span>
      </button>
      <div class="pkg-body" ${i === 0 ? '' : 'hidden'}></div>
    </article>`;
  }).join('');
  const first = list.querySelector('.pkg');
  if (first) open(first);
}
function bodyHTML(p) {
  const st = statusOf(p);
  return `
    <div class="player">
      <canvas width="${W}" height="${H}" aria-label="${esc(p.short)} 쇼츠 미리보기"></canvas>
      <div class="photos" data-photos></div>
      <div class="ctrls">
        <button type="button" class="btn soft" data-play>▶ 재생</button>
        <label class="btn soft">사진 넣기<input type="file" accept="image/*" multiple data-files aria-label="상품 사진 넣기"></label>
        <button type="button" class="btn primary" data-rec>영상 저장</button>
      </div>
      <p class="pnote" data-note>사진을 넣으면 장면마다 돌아가며 들어가요</p>
      <video class="out" controls playsinline hidden data-out></video>
    </div>
    <div class="copies">
      <div class="label"><span>제목</span><span>하나 골라 복사</span></div>
      <div class="group">${p.titles.map((t) => `<div class="cell"><span class="txt">${esc(t)}</span><button type="button" class="copy" data-copy="${esc(t)}">복사</button></div>`).join('')}</div>
      <div class="label"><span>설명란 · 해시태그 · 고정 댓글</span></div>
      <div class="group">
        <div class="cell"><span class="txt long"><span class="k">설명란</span>${esc(p.desc)}</span><button type="button" class="copy" data-copy="${esc(p.desc)}">복사</button></div>
        <div class="cell"><span class="txt"><span class="k">해시태그</span>${esc(p.tagText)}</span><button type="button" class="copy" data-copy="${esc(p.tagText)}">복사</button></div>
        <div class="cell"><span class="txt"><span class="k">고정 댓글</span>${esc(p.comment)}</span><button type="button" class="copy" data-copy="${esc(p.comment)}">복사</button></div>
      </div>
      <div class="label"><span>대본</span><span>${p.total.toFixed(1)}초</span></div>
      <div class="group">${p.scenes.map((s) => `<div class="cell scene"><span class="t">${s.start.toFixed(1)}s</span><span><b>${esc(s.cap)}</b><span>${esc(s.nar)}</span></span></div>`).join('')}</div>
      <div class="row-btns">
        <button type="button" class="copy" data-copy="${esc(p.scenes.map((s) => s.nar).join('\n'))}">내레이션 복사 (TTS용)</button>
        <button type="button" class="copy" data-srt>자막 파일 저장</button>
      </div>
      ${p.example ? '<div class="tipcard"><b>예시 패키지예요</b><span>링크를 보내 주시면 진짜 상품 패키지가 이 위에 추가돼요.</span></div>' : `
      <div class="seg" role="group" aria-label="업로드 상태">
        <button type="button" data-status="todo" aria-pressed="${st === 'todo'}">업로드 전</button>
        <button type="button" data-status="done" aria-pressed="${st === 'done'}">업로드 완료</button>
      </div>`}
    </div>`;
}

/* ---------- 영상 ---------- */
const players = new WeakMap();
function open(art) {
  const body = $('.pkg-body', art);
  const p = PKGS.find((x) => x.id === art.dataset.id);
  if (!body.dataset.ready) {
    body.innerHTML = bodyHTML(p);
    body.dataset.ready = '1';
    const pl = { p, cv: $('canvas', body), images: [], raf: 0, t: 0, body };
    pl.ctx = pl.cv.getContext('2d');
    players.set(art, pl);
    fontsFor(p).then(() => draw(pl, 0.4, true));
    draw(pl, 0.4, true);
  }
  body.hidden = false;
  $('.pkg-head', art).setAttribute('aria-expanded', 'true');
}
function fontsFor(p) {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const txt = p.scenes.map((s) => s.cap).join('') + AD_SHORT + '광고0123456789원%포인트가격기준변동될수있어요' + p.short;
  return Promise.all([document.fonts.load(`900 90px "Noto Sans KR"`, txt), document.fonts.load(`700 30px "Noto Sans KR"`, txt)]).catch(() => {});
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function wrapText(c, text, maxW) {
  const words = String(text).split(/\s+/).filter(Boolean); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (c.measureText(t).width <= maxW || !line) { line = t; continue; }
    lines.push(line); line = w;
  }
  if (line) lines.push(line);
  return lines.flatMap((ln) => {
    if (c.measureText(ln).width <= maxW) return [ln];
    const out = []; let cur = '';
    for (const ch of ln) { if (c.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; } else cur += ch; }
    return cur ? [...out, cur] : out;
  });
}
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const backOut = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
function sceneAt(p, t) {
  for (let i = 0; i < p.scenes.length; i++) if (t < p.scenes[i].start + p.scenes[i].dur) return i;
  return p.scenes.length - 1;
}
function draw(pl, t, still) {
  const { p, ctx: c } = pl;
  const i = sceneAt(p, t), s = p.scenes[i];
  const local = t - s.start, k = Math.min(1, local / s.dur);
  // 배경
  if (pl.images.length) {
    const img = pl.images[i % pl.images.length].img;
    const z = i % 2 ? 1.14 - 0.1 * easeOut(k) : 1.04 + 0.1 * easeOut(k);
    const sc = Math.max(W / img.naturalWidth, H / img.naturalHeight) * z;
    const w = img.naturalWidth * sc, h = img.naturalHeight * sc;
    c.fillStyle = V.ink; c.fillRect(0, 0, W, H);
    c.drawImage(img, (W - w) / 2 + (i % 3 - 1) * 22 * k, (H - h) / 2, w, h);
    let g = c.createLinearGradient(0, 0, 0, 380); g.addColorStop(0, 'rgba(27,30,28,.5)'); g.addColorStop(1, 'rgba(27,30,28,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, 380);
    g = c.createLinearGradient(0, H * 0.42, 0, H); g.addColorStop(0, 'rgba(27,30,28,0)'); g.addColorStop(1, 'rgba(27,30,28,.55)');
    c.fillStyle = g; c.fillRect(0, H * 0.42, W, H * 0.58);
  } else {
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, V.ivory); g.addColorStop(1, V.page);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.save(); c.textAlign = 'center'; c.fillStyle = V.green; c.globalAlpha = 0.08; c.font = `900 150px ${FONT}`;
    wrapText(c, p.short, 900).slice(0, 2).forEach((ln, n) => c.fillText(ln, W / 2, 560 + n * 170));
    c.globalAlpha = 0.6; c.fillStyle = '#878a85'; c.font = `700 34px ${FONT}`;
    c.fillText('사진 넣기를 누르면 여기에 상품 사진이 들어가요', W / 2, 1560);
    c.restore();
  }
  const onPhoto = pl.images.length > 0;
  // 장면
  const pop = still ? 1 : Math.min(1, local / 0.25);
  const sc = 0.8 + 0.2 * backOut(pop);
  c.save(); c.translate(W / 2, 1040); c.scale(sc, sc); c.translate(-W / 2, -1040);
  c.globalAlpha = Math.min(1, pop * 1.6);
  if (s.type === 'price' && p.price) {
    const cw = 760, ch = p.disc ? 380 : 300, cx = (W - cw) / 2, cy = 1040 - ch / 2;
    c.fillStyle = V.cream; rr(c, cx, cy, cw, ch, 40); c.fill();
    c.lineWidth = 4; c.strokeStyle = '#e3d3a4'; c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    if (p.disc) {
      c.fillStyle = '#7a5c17'; c.font = `700 46px ${FONT}`;
      const o = won(p.orig); c.fillText(o, W / 2, cy + 88);
      const ow = c.measureText(o).width; c.fillRect(W / 2 - ow / 2 - 6, cy + 88, ow + 12, 5);
    }
    c.fillStyle = V.green; c.font = `900 ${won(p.price).length > 8 ? 120 : 140}px ${FONT}`;
    c.fillText(won(p.price), W / 2, p.disc ? cy + 236 : cy + ch / 2);
    if (p.disc) {
      c.fillStyle = V.rose; c.beginPath(); c.arc(cx + cw - 64, cy + 6, 80, 0, Math.PI * 2); c.fill();
      c.fillStyle = V.white; c.font = `900 60px ${FONT}`; c.fillText(`-${p.disc}%`, cx + cw - 64, cy + 10);
    }
    c.font = `700 30px ${FONT}`; c.fillStyle = onPhoto ? V.white : '#878a85';
    c.fillText(`${p.date.replace(/-/g, '.')} 기준 · 가격은 바뀔 수 있어요`, W / 2, cy + ch + 52);
  } else {
    const hook = s.type === 'hook' || s.type === 'cta';
    const size = s.type === 'hook' ? 104 : 92;
    c.font = `900 ${size}px ${FONT}`;
    const lines = wrapText(c, s.cap, 800).slice(0, 4);
    const lh = size * 1.22, top = 1040 - (lines.length * lh) / 2;
    if (s.label) {
      c.font = `800 34px ${FONT}`;
      const lw = c.measureText(s.label).width + 40;
      c.fillStyle = V.green; rr(c, W / 2 - lw / 2, top - 84, lw, 56, 28); c.fill();
      c.fillStyle = V.cream; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s.label, W / 2, top - 55);
      c.font = `900 ${size}px ${FONT}`;
    }
    c.textAlign = 'center'; c.textBaseline = 'top'; c.lineJoin = 'round';
    lines.forEach((ln, n) => {
      const y = top + n * lh;
      if (onPhoto) {
        c.lineWidth = 18; c.strokeStyle = V.ink; c.strokeText(ln, W / 2, y);
        c.fillStyle = hook ? V.cream : V.white; c.fillText(ln, W / 2, y);
      } else {
        const tw = c.measureText(ln).width;
        if (hook) { c.fillStyle = V.cream; rr(c, W / 2 - tw / 2 - 26, y - 8, tw + 52, lh - 4, 22); c.fill(); }
        c.fillStyle = hook ? V.green : V.ink; c.fillText(ln, W / 2, y);
      }
    });
  }
  c.restore();
  // 광고 배지 (처음부터 끝까지)
  c.save();
  c.font = `700 30px ${FONT}`;
  const tw = c.measureText(AD_SHORT).width, bx = 60, by = 186, bh = 60, adw = 74;
  c.fillStyle = 'rgba(36,80,63,.92)'; rr(c, bx, by, adw + tw + 40, bh, 30); c.fill();
  c.fillStyle = V.cream; rr(c, bx + 8, by + 8, adw - 8, bh - 16, 22); c.fill();
  c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillStyle = V.green; c.font = `800 26px ${FONT}`;
  c.fillText('광고', bx + 4 + adw / 2, by + bh / 2 + 1);
  c.textAlign = 'left'; c.fillStyle = V.white; c.font = `700 30px ${FONT}`;
  c.fillText(AD_SHORT, bx + adw + 14, by + bh / 2 + 1);
  // 진행 바
  c.fillStyle = onPhoto ? 'rgba(255,255,255,.35)' : 'rgba(36,80,63,.15)'; rr(c, 60, 268, W - 120, 8, 4); c.fill();
  c.fillStyle = onPhoto ? V.cream : V.green; rr(c, 60, 268, Math.max(8, (W - 120) * Math.min(1, t / p.total)), 8, 4); c.fill();
  c.restore();
}
function play(pl, opts = {}) {
  stop(pl);
  const t0 = performance.now();
  const btn = $('[data-play]', pl.body);
  btn.textContent = '■ 정지';
  const tick = (now) => {
    const t = (now - t0) / 1000;
    if (t >= pl.p.total) { draw(pl, pl.p.total - 0.001, false); stop(pl); opts.onEnd && opts.onEnd(); return; }
    draw(pl, t, false);
    pl.raf = requestAnimationFrame(tick);
  };
  pl.raf = requestAnimationFrame(tick);
}
function stop(pl) {
  if (pl.raf) cancelAnimationFrame(pl.raf);
  pl.raf = 0;
  const btn = $('[data-play]', pl.body); if (btn) btn.textContent = '▶ 재생';
}
async function record(pl) {
  if (!window.MediaRecorder || !pl.cv.captureStream) { toast('이 브라우저는 영상 저장을 지원하지 않아요. 크롬에서 열어 주세요'); return; }
  const mime = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m)) || '';
  await fontsFor(pl.p);
  const rec = new MediaRecorder(pl.cv.captureStream(30), mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined);
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const btn = $('[data-rec]', pl.body), note = $('[data-note]', pl.body);
  btn.disabled = true; $('[data-play]', pl.body).disabled = true;
  note.textContent = `만드는 중… ${pl.p.total.toFixed(0)}초 동안 이 화면을 열어 두세요`;
  rec.onstop = async () => {
    const type = rec.mimeType || mime || 'video/webm';
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    const v = $('[data-out]', pl.body);
    if (v.src) URL.revokeObjectURL(v.src);
    v.src = URL.createObjectURL(blob); v.hidden = false;
    btn.disabled = false; $('[data-play]', pl.body).disabled = false;
    note.textContent = `완성 · ${ext.toUpperCase()} ${(blob.size / 1048576).toFixed(1)}MB. 내레이션은 CapCut에서 TTS로 얹어 주세요`;
    await save(`${pl.p.short.replace(/\s+/g, '_')}.${ext}`, blob);
  };
  rec.start(250);
  play(pl, { onEnd: () => setTimeout(() => rec.stop(), 150) });
}
function addPhotos(pl, files) {
  [...files].filter((f) => f.type.startsWith('image/')).forEach((f) => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { pl.images.push({ img, url }); photos(pl); draw(pl, 0.4, true); };
    img.src = url;
  });
}
function photos(pl) {
  $('[data-photos]', pl.body).innerHTML = pl.images.map((m, i) => `<span><img src="${m.url}" alt="사진 ${i + 1}"><button type="button" data-rm="${i}" aria-label="사진 ${i + 1} 빼기">빼기</button></span>`).join('');
}

/* ---------- 저장·복사 ---------- */
const dl = window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(undefined);
async function save(name, blob, altName) {
  const ns = await dl;
  if (ns) {
    try { await ns.save({ filename: altName || name, data: blob }); toast(altName ? '저장했어요. 확장자를 .srt로 바꿔 쓰세요' : '저장했어요'); }
    catch (e) { if (!e || e.code !== 'declined') toast('여기서는 저장할 수 없어요. 위 영상을 길게 눌러 저장해 보세요'); }
    return;
  }
  if (ns === null) { toast('여기서는 저장할 수 없어요. 위 영상을 길게 눌러 저장해 보세요'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function srt(p) {
  const f = (t) => { const ms = Math.round(t * 1000); return `00:${String(Math.floor(ms / 60000)).padStart(2, '0')}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')},${String(ms % 1000).padStart(3, '0')}`; };
  return p.scenes.map((s, i) => `${i + 1}\n${f(s.start)} --> ${f(s.start + s.dur)}\n${s.nar}\n`).join('\n');
}
let tt;
function toast(m) { const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 2200); }
function copy(text, btn) {
  const ok = () => { btn.classList.add('done'); const o = btn.textContent; btn.textContent = '복사됨'; setTimeout(() => { btn.classList.remove('done'); btn.textContent = o; }, 1400); };
  const fail = () => {
    const txt = btn.parentElement.querySelector('.txt');
    if (txt) { const r = document.createRange(); r.selectNodeContents(txt); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('선택했어요. 길게 눌러 복사하세요'); }
    else toast('복사하지 못했어요');
  };
  try { navigator.clipboard.writeText(text).then(ok, fail); } catch { fail(); }
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', (e) => {
  const art = e.target.closest('.pkg'); if (!art) return;
  const head = e.target.closest('.pkg-head');
  if (head) {
    const body = $('.pkg-body', art);
    if (body.hidden) open(art); else { body.hidden = true; head.setAttribute('aria-expanded', 'false'); const pl = players.get(art); if (pl) stop(pl); }
    return;
  }
  const pl = players.get(art); if (!pl) return;
  const c = e.target.closest('[data-copy]'); if (c) { copy(c.dataset.copy, c); return; }
  if (e.target.closest('[data-play]')) { if (pl.raf) { stop(pl); draw(pl, 0.4, true); } else play(pl); return; }
  if (e.target.closest('[data-rec]')) { record(pl); return; }
  if (e.target.closest('[data-srt]')) { const n = pl.p.short.replace(/\s+/g, '_'); save(`${n}.srt`, new Blob([srt(pl.p)], { type: 'text/plain' }), `${n}_srt.txt`); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm) { const [m] = pl.images.splice(+rm.dataset.rm, 1); URL.revokeObjectURL(m.url); photos(pl); draw(pl, 0.4, true); return; }
  const sb = e.target.closest('[data-status]');
  if (sb) {
    const all = store.get(); all[pl.p.id] = sb.dataset.status; store.set(all);
    art.querySelectorAll('[data-status]').forEach((b) => b.setAttribute('aria-pressed', b === sb));
    const chip = $('[data-chip]', art); chip.className = 'chip ' + sb.dataset.status; chip.textContent = STATUS_LABEL[sb.dataset.status];
  }
});
document.addEventListener('change', (e) => {
  if (!e.target.matches('[data-files]')) return;
  const pl = players.get(e.target.closest('.pkg')); if (pl) addPhotos(pl, e.target.files);
  e.target.value = '';
});

render();
})();
</script>
